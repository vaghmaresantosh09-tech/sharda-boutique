name: Apply SILAI GURU back navigation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install expanded garment design library
        run: python3 scripts/expand_design_library.py
      - name: Inject SILAI GURU helper scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('silai-guru.html')
          s=p.read_text(encoding='utf-8')
          tags=['<script src="silai-guru-backfix.js"></script>','<script src="silai-guru-custom-measurements.js"></script>']
          for tag in tags:
              if tag not in s:
                  s=s.replace('</body>', tag+'</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add silai-guru.html
          git diff --cached --quiet && echo 'No HTML changes needed' && exit 0
          git commit -m "Install expanded Silai Guru garment designs [skip design library]"
          git push
