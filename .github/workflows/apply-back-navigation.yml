name: Apply SILAI GURU back navigation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject back navigation script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('silai-guru.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="silai-guru-backfix.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'</body>', 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add silai-guru.html
          git diff --cached --quiet || git commit -m "Fix in-app back navigation"
          git push
