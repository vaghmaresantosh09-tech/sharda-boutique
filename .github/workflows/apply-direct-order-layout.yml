name: Apply direct New Order layout
on:
  push:
    paths:
      - 'silai-guru-order-fix.js'
      - 'silai-guru.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject direct order layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('silai-guru.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="silai-guru-order-fix.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add silai-guru.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Show garments and measurements directly in New Order'
          git push
