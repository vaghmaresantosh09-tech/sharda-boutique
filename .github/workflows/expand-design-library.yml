              'Kameez':[['Straight Kameez','Shalwar_kameez_(1710604).jpg'],['Long Kameez','Shalwar_kameez_(1710609).jpg'],['Embroidered Kameez','Shalwar_kameez.jpg'],['Printed Kameez','Shalwar_kameez_(1710606).jpg'],['Party Kameez','Shalwar_kameez_(32037464703).jpg'],['Designer Kameez','Shalwar_kameez.jpg'],['A-Line Kameez','Shalwar_kameez_(1710604).jpg'],['Front Slit Kameez','Shalwar_kameez_(1710609).jpg'],['Cotton Kameez','Shalwar_kameez_(1710606).jpg'],['Festive Kameez','Shalwar_kameez_(32037464703).jpg']],
              'Saree Blouse':[['Classic Saree Blouse','Blouse_MET_CI44.111_F.jpg'],['Designer Saree Blouse','Blouse_MET_CI44.111_B.jpg'],['Back Open Saree Blouse','Blouse_MET_CI44.111_F.jpg'],['Boat Neck Saree Blouse','Blouse_MET_CI44.111_B.jpg'],['Padded Saree Blouse','Blouse_MET_CI44.111_F.jpg'],['Princess Cut Saree Blouse','Blouse_MET_CI44.111_B.jpg'],['Sleeveless Saree Blouse','Blouse_MET_CI44.111_F.jpg'],['Elbow Sleeve Saree Blouse','Blouse_MET_CI44.111_B.jpg'],['High Neck Saree Blouse','Blouse_MET_CI44.111_F.jpg'],['Deep Neck Saree Blouse','Blouse_MET_CI44.111_F.jpg']],
              'Choli':[['Classic Choli','Cultural_costume.jpg'],['Bridal Choli','Lehenga_-_Kanchan_Fashion.jpg'],['Designer Choli','Cultural_costume.jpg'],['Mirror Work Choli','Cultural_costume.jpg'],['Embroidered Choli','Lehenga_-_Kanchan_Fashion.jpg'],['Back Open Choli','Blouse_MET_CI44.111_B.jpg'],['Boat Neck Choli','Blouse_MET_CI44.111_F.jpg'],['Sleeveless Choli','Blouse_MET_CI44.111_B.jpg'],['Long Choli','Lehenga_-_Kanchan_Fashion.jpg'],['Festive Choli','Cultural_costume.jpg']],
              'Shirt':[['Formal Shirt','Kurta_-_Mens.jpg'],['Casual Shirt','Kurta_-_Mens.jpg'],['Mandarin Collar Shirt','Kurta_-_Mens.jpg'],['Band Collar Shirt','Kurta_-_Mens.jpg'],['Designer Shirt','Kurta_-_Mens.jpg'],['Long Shirt','Kurta_-_Mens.jpg'],['Short Shirt','Kurta_-_Mens.jpg'],['Party Shirt','Kurta_-_Mens.jpg'],['Printed Shirt','Kurta_-_Mens.jpg'],['Wedding Shirt','Kurta_-_Mens.jpg']],
              'Pant':[['Straight Pant','Shalwar_kameez_(1710604).jpg'],['Palazzo Pant','Shalwar_kameez_(1710609).jpg'],['Cigarette Pant','Shalwar_kameez_(1710606).jpg'],['Ankle Pant','Shalwar_kameez_(32037464703).jpg'],['Wide Leg Pant','Shalwar_kameez_(1710604).jpg'],['Flared Pant','Shalwar_kameez_(1710609).jpg'],['Sharara Pant','Shalwar_kameez_(1710606).jpg'],['Patiala Pant','Shalwar_kameez_(32037464703).jpg'],['Designer Pant','Shalwar_kameez_(1710604).jpg'],['Comfort Pant','Shalwar_kameez_(1710609).jpg']],
              'Salwar':[['Patiala Salwar','Shalwar_kameez_(1710604).jpg'],['Straight Salwar','Shalwar_kameez_(1710609).jpg'],['Churidar Salwar','Shalwar_kameez_(1710606).jpg'],['Afghani Salwar','Shalwar_kameez.jpg'],['Dhoti Salwar','Shalwar_kameez_(32037464703).jpg'],['Designer Salwar','Shalwar_kameez_(1710604).jpg'],['Parallel Salwar','Shalwar_kameez_(1710609).jpg'],['Gathered Salwar','Shalwar_kameez_(1710606).jpg']],
