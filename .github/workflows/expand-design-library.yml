            function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
            function url(name){return IMG+encodeURIComponent(name).replace(/%2F/g,'/');}
            function openExpandedLibrary(){
              const box=document.getElementById('mb'); if(!box)return;
              let current=null;
              const garments=Object.keys(DATA);
              function renderList(){
                box.innerHTML='<button class="close" onclick="closeM()">✕</button><h2>🎨 SILAI GURU Design Library</h2><div class="sgx-note"><b>Actual garment photos</b><br>Har garment ke liye alag design folder. Built-in library photos user ke personal backup quota me save nahi hongi.</div><input class="design-search" id="sgxSearch" placeholder="🔎 Search garment design..."><div class="garment-library">'+garments.map(g=>'<button class="garment-library-card" data-g="'+esc(g)+'"><div class="libpic"><span style="font-size:44px">👗</span></div><b>'+esc(g)+'</b><small>'+DATA[g].length+' designs</small></button>').join('')+'</div>';
                box.querySelectorAll('[data-g]').forEach(b=>b.addEventListener('click',()=>renderFolder(b.dataset.g)));
                const q=box.querySelector('#sgxSearch'); q.addEventListener('input',()=>{const v=q.value.toLowerCase();box.querySelectorAll('[data-g]').forEach(b=>b.style.display=b.dataset.g.toLowerCase().includes(v)?'':'none')});
              }
              function renderFolder(g){
                current=g; const items=DATA[g]||[];
                box.innerHTML='<button class="sgx-back" id="sgxBack">← Garments</button><h2>👗 '+esc(g)+' · '+items.length+' Designs</h2><div class="sgx-note">'+esc(g)+' ke actual photo references. Design card par <b>Show</b> dabakar bada photo dekhein.</div><input class="design-search" id="sgxDS" placeholder="🔎 Search '+esc(g)+' design..."><div class="sgx-count">'+items.length+' designs available</div><div class="sgx-grid">'+items.map((d,i)=>'<div class="sgx-card"><div class="sgx-photo"><img loading="lazy" src="'+url(d[1])+'" alt="'+esc(d[0])+'" onerror="this.style.display=\'none\';this.parentElement.innerHTML=\'<div style=\'padding:20px;text-align:center;color:#777\'>Photo unavailable</div>\'"></div><div class="sgx-name">'+esc(d[0])+'</div><div class="sgx-source">Built-in reference</div><div class="sgx-actions"><button class="secondary" data-save="'+i+'">☆ Save</button><button class="primary" data-show="'+i+'">👁 Show</button></div></div>').join('')+'</div>';
                box.querySelector('#sgxBack').addEventListener('click',renderList);
                box.querySelector('#sgxDS').addEventListener('input',function(){const v=this.value.toLowerCase();box.querySelectorAll('.sgx-card').forEach(c=>c.style.display=c.querySelector('.sgx-name').textContent.toLowerCase().includes(v)?'':'none')});
                box.querySelectorAll('[data-show]').forEach(b=>b.addEventListener('click',()=>{const d=items[+b.dataset.show];box.innerHTML='<button class="sgx-back" id="sgxPreviewBack">← '+esc(g)+'</button><h2>'+esc(d[0])+'</h2><div class="preview-large" style="height:520px;max-width:420px"><img src="'+url(d[1])+'" alt="'+esc(d[0])+'" style="width:100%;height:100%;object-fit:contain;border-radius:18px"></div><button class="primary" id="sgxUse">✓ Use this design in order</button>';box.querySelector('#sgxPreviewBack').addEventListener('click',()=>renderFolder(g));box.querySelector('#sgxUse').addEventListener('click',()=>{try{localStorage.setItem('sgSelectedDesign',JSON.stringify({garment:g,name:d[0],image:url(d[1])}))}catch(e){} alert(d[0]+' selected. Ab New Order me ise use kar sakte hain.');});}));
              }
              renderList();
            }
            window.openGarmentLibrary=openExpandedLibrary;
          })();
          </script>
