      - name: Commit updated library
        shell: bash
        run: |
          git config user.name "silai-guru-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add silai-guru.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Expand all garment design libraries with real photo references"
            git push
          fi
