name: Expand Silai Guru garment design library V4

on:
  push:
    branches: [main]
    paths:
      - 'silai-guru.html'
      - '.github/workflows/expand-real-designs-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    if: ${{ !contains(github.event.head_commit.message, '[skip design library]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install richer garment designs
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('silai-guru.html')
          s = p.read_text(encoding='utf-8')

          if 'SG_DESIGN_LIBRARY_V4' in s:
              print('V4 already installed')
              raise SystemExit(0)

          extra = {
            'Kurti':['Angrakha Kurti','Asymmetric Kurti','Cowl Neck Kurti','Collar Kurti','High Slit Kurti','Flared Kurti','Tiered Kurti','Layered Kurti'],
            'Blouse':['V-Neck Blouse','Round Neck Blouse','Square Neck Blouse','Sweetheart Blouse','Halter Neck Blouse','Peplum Blouse','Angrakha Blouse','Keyhole Blouse'],
            'Salwar Suit':['A-Line Suit','Angrakha Suit','C-Cut Suit','Layered Suit','Cape Suit','Jacket Suit','Gharara Suit','Sharara Suit'],
            'Kameez':['Straight Kameez','A-Line Kameez','Anarkali Kameez','Angrakha Kameez','Front Slit Kameez','Side Slit Kameez','Embroidered Kameez','Printed Kameez'],
            'Saree Blouse':['U-Neck Saree Blouse','V-Neck Saree Blouse','Square Neck Saree Blouse','Sweetheart Saree Blouse','Keyhole Saree Blouse','High Neck Saree Blouse','Peplum Saree Blouse','Back Tie Saree Blouse'],
            'Lehenga':['A-Line Lehenga','Flared Lehenga','Panelled Lehenga','Ruffle Lehenga','Circular Lehenga','Layered Lehenga','Bridal Lehenga','Indo-Western Lehenga'],
            'Gown':['A-Line Gown','Ball Gown','Mermaid Gown','Empire Gown','Cape Gown','Tiered Gown','Anarkali Gown','Off Shoulder Gown'],
            'Dress':['A-Line Dress','Fit and Flare Dress','Maxi Dress','Midi Dress','Shirt Dress','Wrap Dress','Tiered Dress','Princess Dress'],
            'Shirt':['Mandarin Collar Shirt','Peter Pan Collar Shirt','Peplum Shirt','Tunic Shirt','Longline Shirt','Ruffle Shirt','Oversized Shirt','Embroidered Shirt'],
            'Pant':['Straight Pant','Slim Pant','Wide Leg Pant','Flared Pant','Cigarette Pant','Cargo Pant','Ankle Pant','Palazzo Pant'],
            'Salwar':['Patiala Salwar','Dhoti Salwar','Churidar Salwar','Straight Salwar','Semi Patiala Salwar','Afghani Salwar','Parallel Salwar','Tulip Salwar'],
            'Choli':['Short Choli','Long Choli','Peplum Choli','Sleeveless Choli','Off Shoulder Choli','High Neck Choli','Backless Choli','Embroidered Choli'],
            'Blazer':['Single Button Blazer','Double Button Blazer','Cropped Blazer','Longline Blazer','Peplum Blazer','Tuxedo Blazer','Collarless Blazer','Printed Blazer'],
            'Suit':['Straight Suit','A-Line Suit','Jacket Suit','Bandhgala Suit','Three Piece Suit','Designer Suit','Wedding Suit','Formal Suit'],
            'Waistcoat':['Classic Waistcoat','Long Waistcoat','Cropped Waistcoat','Embroidered Waistcoat','Nehru Waistcoat','Buttoned Waistcoat','Printed Waistcoat','Layered Waistcoat'],
            'Sherwani':['Classic Sherwani','Achkan Sherwani','Jodhpuri Sherwani','Indo-Western Sherwani','Embroidered Sherwani','Bandhgala Sherwani','Long Sherwani','Wedding Sherwani'],
            'Pajama':['Straight Pajama','Churidar Pajama','Pathani Pajama','Cotton Pajama','Silk Pajama','Loose Pajama','Slim Pajama','Embroidered Pajama'],
            'School Uniform':['Summer Uniform','Winter Uniform','House Uniform','Sports Uniform','Prefect Uniform','Girls Uniform','Boys Uniform','Formal Uniform'],
            'Coat':['Long Coat','Short Coat','Overcoat','Trench Coat','Tailored Coat','Cape Coat','Nehru Coat','Winter Coat'],
            'Other':['Designer Set','Fusion Wear','Festive Wear','Casual Wear','Party Wear','Wedding Wear','Custom Style','Latest Style']
          }

          for typ, names in extra.items():
              pat = re.compile(r'([\'\"]?' + re.escape(typ) + r'[\'\"]?\s*:\s*\[)([^\]]*)(\])')
              m = pat.search(s)
              if not m:
                  continue
              existing = m.group(2)
              additions = [n for n in names if "'" + n + "'" not in existing and '"' + n + '"' not in existing]
              if additions:
                  sep = ',' if existing.strip() else ''
                  replacement = m.group(1) + existing + sep + ','.join("'" + n + "'" for n in additions) + m.group(3)
                  s = s[:m.start()] + replacement + s[m.end():]

          start = s.find('function designVisual(type,index){')
          if start < 0:
              raise SystemExit('designVisual function not found')
          nxt = s.find('function ', start + 10)
          if nxt < 0:
              raise SystemExit('next function boundary not found')

          visual = r'''function designVisual(type,index){
            const colors=['#e88ca8','#6d9fe8','#d7a74e','#69b5a4','#9a82d7','#e7805b','#647c9b','#d56f91','#7ea85e','#b78464','#6d83c8','#bb6e9e','#d18b4a','#5f9b82','#8c69b6','#cf6c64'];
            const c=colors[index%colors.length], dark='#3d3854', pale='#fffdf9', gold='#d6a53d';
            const n=index%8;
            const necks=[`M165 82 Q200 112 235 82`,`M165 82 L200 115 L235 82`,`M168 84 Q200 58 232 84`,`M170 82 L200 101 L230 82`,`M166 82 Q200 98 234 82`,`M172 80 L200 112 L228 80`,`M168 82 Q200 72 232 82`,`M175 82 L200 104 L225 82`];
            const neck=necks[n];
            const sleevePaths=[
              `<path d="M142 105 L86 150 L111 184 L160 142" fill="${c}" stroke="${dark}" stroke-width="4"/><path d="M258 105 L314 150 L289 184 L240 142" fill="${c}" stroke="${dark}" stroke-width="4"/>`,
              `<path d="M142 105 L72 166 L104 196 L164 142" fill="${c}" stroke="${dark}" stroke-width="4"/><path d="M258 105 L328 166 L296 196 L236 142" fill="${c}" stroke="${dark}" stroke-width="4"/>`,
              `<path d="M145 108 L100 155 L116 176 L163 140" fill="${c}" stroke="${dark}" stroke-width="4"/><path d="M255 108 L300 155 L284 176 L237 140" fill="${c}" stroke="${dark}" stroke-width="4"/>`,
              `<path d="M145 108 L92 146 L106 176 L164 139" fill="${c}" stroke="${dark}" stroke-width="4"/><path d="M255 108 L308 146 L294 176 L236 139" fill="${c}" stroke="${dark}" stroke-width="4"/>`
            ][n%4];
            const upper=['Pant','Salwar','Pajama'].includes(type);
            const full=['Lehenga','Gown','Dress'].includes(type);
            const crop=['Blouse','Saree Blouse','Choli'].includes(type);
            const formal=['Blazer','Suit','Waistcoat','Sherwani','Coat'].includes(type);
            const indian=['Kurti','Kameez','Salwar Suit'].includes(type);
            let garment='';
            if(upper){
              garment=`<path d="M150 76 L250 76 L270 160 L236 160 L230 320 L200 350 L170 320 L164 160 L130 160 Z" fill="${c}" stroke="${dark}" stroke-width="4"/><path d="M164 160 L200 184 L236 160" fill="none" stroke="${pale}" stroke-width="5"/><path d="M180 190 L174 310 M220 190 L226 310" stroke="${dark}" stroke-width="3" opacity=".5"/>`;
            }else if(full){
              garment=`<path d="M158 75 Q200 112 242 75 L258 180 Q326 248 350 344 L50 344 Q74 248 142 180 Z" fill="${c}" stroke="${dark}" stroke-width="4"/><path d="${neck}" fill="none" stroke="${pale}" stroke-width="6"/><path d="M200 108 L200 338" stroke="${pale}" stroke-width="4" opacity=".8"/><path d="M92 270 Q200 304 308 270" fill="none" stroke="${pale}" stroke-width="5" opacity=".75"/>`;
            }else if(formal){
              garment=`<path d="M148 74 L252 74 L276 330 L124 330 Z" fill="${c}" stroke="${dark}" stroke-width="4"/><path d="M168 74 L200 120 L232 74" fill="none" stroke="${pale}" stroke-width="6"/><path d="M200 120 L200 324" stroke="${dark}" stroke-width="3"/><circle cx="200" cy="160" r="6" fill="${pale}"/><circle cx="200" cy="192" r="6" fill="${pale}"/><path d="M140 222 L174 222 M226 222 L260 222" stroke="${dark}" stroke-width="5"/>`;
            }else{
              const bottom= crop ? 260 : (indian ? 335 : 315);
              garment=`<path d="M154 76 L246 76 L278 154 L250 ${bottom} L150 ${bottom} L122 154 Z" fill="${c}" stroke="${dark}" stroke-width="4"/><path d="${neck}" fill="none" stroke="${pale}" stroke-width="6"/><path d="M200 108 L200 ${bottom-10}" stroke="${pale}" stroke-width="3" opacity=".8"/><path d="M148 194 Q200 220 252 194" fill="none" stroke="${pale}" stroke-width="4" opacity=".8"/>`;
            }
            const embellish = n%4===0 ? `<circle cx="180" cy="148" r="5" fill="${gold}"/><circle cx="200" cy="162" r="5" fill="${gold}"/><circle cx="220" cy="148" r="5" fill="${gold}"/>` : n%4===1 ? `<path d="M150 245 Q200 274 250 245 M158 263 Q200 288 242 263" fill="none" stroke="${pale}" stroke-width="5"/>` : n%4===2 ? `<path d="M150 126 L125 150 M250 126 L275 150 M165 286 L235 286" stroke="${gold}" stroke-width="5" stroke-linecap="round"/>` : `<path d="M150 225 L250 225 M158 242 L242 242" stroke="${pale}" stroke-width="4" opacity=".9"/>`;
            const dupatta = (type==='Salwar Suit'||type==='Lehenga'||type==='Kameez') ? `<path d="M285 82 Q350 140 332 330" fill="none" stroke="${gold}" stroke-width="12" opacity=".85"/><path d="M290 84 Q350 142 334 330" fill="none" stroke="${pale}" stroke-width="3"/>` : '';
            return `<svg viewBox="0 0 400 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${type} fashion design"><rect x="8" y="8" width="384" height="364" rx="28" fill="#faf9ff"/><text x="200" y="38" text-anchor="middle" font-size="16" font-weight="800" fill="${dark}">${type} • Design ${index+1}</text>${upper?'':sleevePaths}${garment}${embellish}${dupatta}<path d="M105 350 H295" stroke="${c}" stroke-width="8" stroke-linecap="round"/><circle cx="120" cy="350" r="5" fill="${dark}"/><circle cx="280" cy="350" r="5" fill="${dark}"/></svg>`;
          }
          '''

          s = s[:start] + visual + s[nxt:]
          s = s.replace('</head>', '<!-- SG_DESIGN_LIBRARY_V4 -->\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          print('Installed V4: more design choices and richer garment-specific fashion artwork.')

      - name: Commit generated update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add silai-guru.html
          git diff --cached --quiet && echo 'No changes' && exit 0
          git commit -m 'Improve garment design library V4 [skip design library]'
          git push
