name: Fix and expand Silai Guru design library

on:
  push:
    branches: [main]
    paths:
      - 'silai-guru.html'
      - '.github/workflows/fix-design-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip design library]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand garment designs
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('silai-guru.html')
          s=p.read_text(encoding='utf-8')
          if 'SG_DESIGN_LIBRARY_V2' in s:
              print('Already patched')
              raise SystemExit(0)

          extra={
            'Kurti':['V-Neck Kurti','Square Neck Kurti','Angrakha Kurti','Asymmetric Kurti','Chikankari Kurti','Block Print Kurti','Tiered Kurti','Designer Kurti'],
            'Blouse':['V-Neck Blouse','Round Neck Blouse','Square Neck Blouse','Sweetheart Blouse','Halter Neck Blouse','Peplum Blouse','Angrakha Blouse','Boat Back Blouse'],
            'Salwar Suit':['A-Line Suit','Angrakha Suit','C-Cut Suit','Layered Suit','Cape Suit','Jacket Suit','Gharara Suit','Sharara Kurta Suit'],
            'Kameez':['Straight Kameez','A-Line Kameez','Anarkali Kameez','Angrakha Kameez','Front Slit Kameez','Side Slit Kameez','Embroidered Kameez','Printed Kameez'],
            'Saree Blouse':['U-Neck Saree Blouse','V-Neck Saree Blouse','Square Neck Saree Blouse','Sweetheart Saree Blouse','Keyhole Saree Blouse','High Neck Saree Blouse','Peplum Saree Blouse','Back Tie Saree Blouse'],
            'Lehenga':['A-Line Lehenga','Flared Lehenga','Panelled Lehenga','Ruffle Lehenga','Circular Lehenga','Layered Lehenga','Bridal Lehenga','Indo-Western Lehenga'],
            'Gown':['A-Line Gown','Ball Gown','Mermaid Gown','Empire Gown','Cape Gown','Tiered Gown','Anarkali Gown','Off Shoulder Gown'],
            'Dress':['A-Line Dress','Fit and Flare Dress','Maxi Dress','Midi Dress','Shirt Dress','Wrap Dress','Tiered Dress','Princess Dress'],
            'Shirt':['Mandarin Collar Shirt','Peter Pan Collar Shirt','Peplum Shirt','Tunic Shirt','Longline Shirt','Ruffle Shirt','Oversized Shirt','Embroidered Shirt'],
            'Pant':['Straight Pant','Slim Pant','Wide Leg Pant','Flared Pant','Cigarette Pant','Cargo Pant','Ankle Pant','Palazzo Pant'],
            'Salwar':['Patiala Salwar','Dhoti Salwar','Churidar Salwar','Straight Salwar','Semi Patiala Salwar','Afghani Salwar','Parallel Salwar','Tulip Salwar'],
            'Choli':['Short Choli','Long Choli','Peplum Choli','Sleeveless Choli','Off Shoulder Choli','High Neck Choli','Backless Choli','Embroidered Choli'],
            'Blazer':['Single Button Blazer','Double Button Blazer','Cropped Blazer','Longline Blazer','Peplum Blazer','Tuxedo Blazer','Collarless Blazer','Printed Blazer'],
            'Suit':['Straight Suit','A-Line Suit','Jacket Suit','Bandhgala Suit','Three Piece Suit','Designer Suit','Wedding Suit','Formal Suit'],
            'Waistcoat':['Classic Waistcoat','Long Waistcoat','Cropped Waistcoat','Embroidered Waistcoat','Nehru Waistcoat','Buttoned Waistcoat','Printed Waistcoat','Layered Waistcoat'],
            'Sherwani':['Classic Sherwani','Achkan Sherwani','Jodhpuri Sherwani','Indo-Western Sherwani','Embroidered Sherwani','Bandhgala Sherwani','Long Sherwani','Wedding Sherwani'],
            'Pajama':['Straight Pajama','Churidar Pajama','Pathani Pajama','Cotton Pajama','Silk Pajama','Loose Pajama','Slim Pajama','Embroidered Pajama'],
            'School Uniform':['Summer Uniform','Winter Uniform','House Uniform','Sports Uniform','Prefect Uniform','Girls Uniform','Boys Uniform','Formal Uniform'],
            'Coat':['Long Coat','Short Coat','Overcoat','Trench Coat','Tailored Coat','Cape Coat','Nehru Coat','Winter Coat'],
            'Other':['Designer Set','Fusion Wear','Festive Wear','Casual Wear','Party Wear','Wedding Wear','Custom Style','Latest Style']
          }

          # Expand every matching DESIGN_TYPES array without fragile category-specific regex.
          array_re=re.compile(r'([A-Za-z][A-Za-z ]*):\[([^\]]*)\]')
          def expand(m):
              typ=m.group(1).strip()
              body=m.group(2)
              adds=extra.get(typ,[])
              for n in adds:
                  if "'"+n+"'" not in body:
                      body += (',' if body.strip() else '') + "'"+n+"'"
              return m.group(1)+':['+body+']'
          s=array_re.sub(expand,s)

          # Replace the old generic icon generator with detailed fashion-flat artwork.
          start=s.find('function designVisual(type,index){')
          if start<0: raise SystemExit('designVisual function not found')
          nxt=s.find('function ',start+10)
          if nxt<0: raise SystemExit('next function boundary not found')
          visual=r'''function designVisual(type,index){
            const colors=['#e98aa5','#5e9be8','#d6a64a','#6db9a8','#9a83dc','#e77b55','#5c718f','#d56c8a','#7da05a','#b78663','#6c83c4','#b96a9e'];
            const c=colors[index%colors.length],d='#40395a',w='#fff';
            const short=['Blouse','Saree Blouse','Choli'].includes(type),lower=['Pant','Salwar','Pajama'].includes(type),wide=['Lehenga','Gown','Dress'].includes(type),outer=['Blazer','Suit','Waistcoat','Sherwani','Coat'].includes(type);
            const neck=index%4===0?'M170 72 Q200 98 230 72':index%4===1?'M168 72 L200 104 L232 72':index%4===2?'M170 76 Q200 54 230 76':'M172 72 L200 92 L228 72';
            let body;
            if(lower) body=`<path d="M155 70L245 70L270 160L235 160L230 290L200 340L170 290L165 160L130 160Z" fill="${c}" stroke="${d}" stroke-width="4"/><path d="M190 82V285M210 82V285" stroke="${d}" stroke-width="2" opacity=".55"/>`;
            else if(wide) body=`<path d="M160 70Q200 105 240 70L258 180Q330 250 345 335H55Q70 250 142 180Z" fill="${c}" stroke="${d}" stroke-width="4"/><path d="M200 104V330M105 270Q200 300 295 270" fill="none" stroke="${w}" stroke-width="4" opacity=".8"/>`;
            else if(outer) body=`<path d="M150 72L250 72L275 320H125Z" fill="${c}" stroke="${d}" stroke-width="4"/><path d="M175 72L200 115L225 72M200 115V315" fill="none" stroke="${w}" stroke-width="5"/><circle cx="200" cy="155" r="6" fill="${w}"/><circle cx="200" cy="185" r="6" fill="${w}"/>`;
            else body=`<path d="M155 72L245 72L275 155L250 ${short?250:320}H150L125 155Z" fill="${c}" stroke="${d}" stroke-width="4"/><path d="${neck}" fill="none" stroke="${w}" stroke-width="6"/><path d="M200 100V${short?245:310}" stroke="${w}" stroke-width="3"/><path d="M150 190Q200 215 250 190" fill="none" stroke="${w}" stroke-width="4"/>`;
            const sleeves=lower?'':`<path d="M138 103L92 150L112 170L160 136M262 103L308 150L288 170L240 136" fill="${c}" stroke="${d}" stroke-width="4"/>`;
            const detail=index%3===0?`<circle cx="185" cy="140" r="4" fill="${w}"/><circle cx="200" cy="155" r="4" fill="${w}"/><circle cx="215" cy="140" r="4" fill="${w}"/>`:index%3===1?`<path d="M145 245Q200 270 255 245M155 260Q200 285 245 260" fill="none" stroke="${w}" stroke-width="4"/>`:`<path d="M145 120L120 145M255 120L280 145" stroke="${w}" stroke-width="5"/>`;
            return `<svg viewBox="0 0 400 380" xmlns="http://www.w3.org/2000/svg" aria-label="${type} design"><rect x="8" y="8" width="384" height="364" rx="28" fill="#faf9ff"/><text x="200" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="${d}">${type}</text>${sleeves}${body}${detail}<path d="M105 345H295" stroke="${c}" stroke-width="8" stroke-linecap="round"/></svg>`;
          }
          '''
          s=s[:start]+visual+s[nxt:]
          s=s.replace('</head>','<!-- SG_DESIGN_LIBRARY_V2 -->\n</head>',1)
          p.write_text(s,encoding='utf-8')
          print('Design library expanded and detailed artwork installed.')

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add silai-guru.html
          git diff --cached --quiet && echo 'No changes to commit' && exit 0
          git commit -m 'Expand garment designs [skip design library]'
          git push
