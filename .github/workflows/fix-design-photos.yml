name: Fix and expand Silai Guru design library

on:
  push:
    branches: [main]
    paths:
      - 'silai-guru.html'
      - '.github/workflows/fix-design-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip design library]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand garment design library
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('silai-guru.html')
          s = p.read_text(encoding='utf-8')

          if 'SG_DESIGN_LIBRARY_V2' in s:
              print('Design Library V2 already installed; nothing to do.')
              raise SystemExit(0)

          extra = {
            'Kurti':['V-Neck Kurti','Square Neck Kurti','Angrakha Kurti','Asymmetric Kurti','Chikankari Kurti','Block Print Kurti','Tiered Kurti','Designer Kurti'],
            'Blouse':['V-Neck Blouse','Round Neck Blouse','Square Neck Blouse','Sweetheart Blouse','Halter Neck Blouse','Peplum Blouse','Angrakha Blouse','Boat Back Blouse'],
            'Salwar Suit':['A-Line Suit','Angrakha Suit','C-Cut Suit','Layered Suit','Cape Suit','Jacket Suit','Gharara Suit','Sharara Kurta Suit'],
            'Kameez':['Straight Kameez','A-Line Kameez','Anarkali Kameez','Angrakha Kameez','Front Slit Kameez','Side Slit Kameez','Embroidered Kameez','Printed Kameez'],
            'Saree Blouse':['U-Neck Saree Blouse','V-Neck Saree Blouse','Square Neck Saree Blouse','Sweetheart Saree Blouse','Keyhole Saree Blouse','High Neck Saree Blouse','Peplum Saree Blouse','Back Tie Saree Blouse'],
            'Lehenga':['A-Line Lehenga','Flared Lehenga','Panelled Lehenga','Ruffle Lehenga','Circular Lehenga','Layered Lehenga','Bridal Lehenga','Indo-Western Lehenga'],
            'Gown':['A-Line Gown','Ball Gown','Mermaid Gown','Empire Gown','Cape Gown','Tiered Gown','Anarkali Gown','Off Shoulder Gown'],
            'Dress':['A-Line Dress','Fit and Flare Dress','Maxi Dress','Midi Dress','Shirt Dress','Wrap Dress','Tiered Dress','Princess Dress'],
            'Shirt':['Mandarin Collar Shirt','Peter Pan Collar Shirt','Peplum Shirt','Tunic Shirt','Longline Shirt','Ruffle Shirt','Oversized Shirt','Embroidered Shirt'],
            'Pant':['Straight Pant','Slim Pant','Wide Leg Pant','Flared Pant','Cigarette Pant','Cargo Pant','Ankle Pant','Palazzo Pant'],
            'Salwar':['Patiala Salwar','Dhoti Salwar','Churidar Salwar','Straight Salwar','Semi Patiala Salwar','Afghani Salwar','Parallel Salwar','Tulip Salwar'],
            'Choli':['Short Choli','Long Choli','Peplum Choli','Sleeveless Choli','Off Shoulder Choli','High Neck Choli','Backless Choli','Embroidered Choli'],
            'Blazer':['Single Button Blazer','Double Button Blazer','Cropped Blazer','Longline Blazer','Peplum Blazer','Tuxedo Blazer','Collarless Blazer','Printed Blazer'],
            'Suit':['Straight Suit','A-Line Suit','Jacket Suit','Bandhgala Suit','Three Piece Suit','Designer Suit','Wedding Suit','Formal Suit'],
            'Waistcoat':['Classic Waistcoat','Long Waistcoat','Cropped Waistcoat','Embroidered Waistcoat','Nehru Waistcoat','Buttoned Waistcoat','Printed Waistcoat','Layered Waistcoat'],
            'Sherwani':['Classic Sherwani','Achkan Sherwani','Jodhpuri Sherwani','Indo-Western Sherwani','Embroidered Sherwani','Bandhgala Sherwani','Long Sherwani','Wedding Sherwani'],
            'Pajama':['Straight Pajama','Churidar Pajama','Pathani Pajama','Cotton Pajama','Silk Pajama','Loose Pajama','Slim Pajama','Embroidered Pajama'],
            'School Uniform':['Summer Uniform','Winter Uniform','House Uniform','Sports Uniform','Prefect Uniform','Girls Uniform','Boys Uniform','Formal Uniform'],
            'Coat':['Long Coat','Short Coat','Overcoat','Trench Coat','Tailored Coat','Cape Coat','Nehru Coat','Winter Coat'],
            'Other':['Designer Set','Fusion Wear','Festive Wear','Casual Wear','Party Wear','Wedding Wear','Custom Style','Latest Style']
          }

          for typ, names in extra.items():
              pat = re.compile(r'(^|,)\\s*' + re.escape(typ) + r'\\s*:\\s*\\[([^\\]]*)\\]', re.M)
              m = pat.search(s)
              if not m:
                  continue
              existing = m.group(2)
              additions = [n for n in names if "'" + n + "'" not in existing]
              if additions:
                  replacement = m.group(0)[:-1] + (',' if existing.strip() else '') + ','.join("'" + n + "'" for n in additions) + ']'
                  s = s[:m.start()] + replacement + s[m.end():]

          # Detailed garment-design artwork: each card gets a distinct fashion-flat visual instead of the old generic icon.
          start = s.find('function designVisual(type,index){')
          if start < 0:
              raise SystemExit('designVisual function not found')
          nxt = s.find('function ', start + 10)
          if nxt < 0:
              raise SystemExit('next function boundary not found')

          new_visual = r'''function designVisual(type,index){
            const palettes=['#e98aa5','#5e9be8','#d6a64a','#6db9a8','#9a83dc','#e77b55','#5c718f','#d56c8a','#7da05a','#b78663','#6c83c4','#b96a9e'];
            const col=palettes[index%palettes.length];
            const dark='#40395a',light='#fff';
            const necks=[`M170 72 Q200 98 230 72`,`M168 72 L200 104 L232 72`,`M170 76 Q200 54 230 76`,`M172 72 L200 92 L228 72`];
            const neck=necks[index%necks.length];
            const sleeve=(index%4===0)?`<path d="M135 100 L82 145 L108 176 L160 138" fill="${col}" stroke="${dark}" stroke-width="4"/><path d="M265 100 L318 145 L292 176 L240 138" fill="${col}" stroke="${dark}" stroke-width="4"/>`:(index%4===1)?`<path d="M135 100 L75 155 L105 182 L162 140" fill="${col}" stroke="${dark}" stroke-width="4"/><path d="M265 100 L325 155 L295 182 L238 140" fill="${col}" stroke="${dark}" stroke-width="4"/>`:`<path d="M138 103 L92 150 L112 170 L160 136" fill="${col}" stroke="${dark}" stroke-width="4"/><path d="M262 103 L308 150 L288 170 L240 136" fill="${col}" stroke="${dark}" stroke-width="4"/>`;
            const lower=['Pant','Salwar','Pajama'].includes(type);
            const wide=['Lehenga','Gown','Dress'].includes(type);
            const short=['Blouse','Saree Blouse','Choli'].includes(type);
            const coat=['Blazer','Suit','Waistcoat','Sherwani','Coat'].includes(type);
            let body;
            if(lower){body=`<path d="M155 70 L245 70 L270 160 L235 160 L230 290 L200 340 L170 290 L165 160 L130 160 Z" fill="${col}" stroke="${dark}" stroke-width="4"/><path d="M165 160 L200 185 L235 160" fill="none" stroke="${light}" stroke-width="5"/><path d="M190 82 L190 285 M210 82 L210 285" stroke="${dark}" stroke-width="2" opacity=".55"/>`;}
            else if(wide){body=`<path d="M160 70 Q200 105 240 70 L258 180 Q330 250 345 335 L55 335 Q70 250 142 180 Z" fill="${col}" stroke="${dark}" stroke-width="4"/><path d="M200 104 L200 330" stroke="${light}" stroke-width="4" opacity=".8"/><path d="M105 270 Q200 300 295 270" fill="none" stroke="${light}" stroke-width="4" opacity=".75"/>`;}
            else if(coat){body=`<path d="M150 72 L250 72 L275 320 L125 320 Z" fill="${col}" stroke="${dark}" stroke-width="4"/><path d="M175 72 L200 115 L225 72" fill="none" stroke="${light}" stroke-width="5"/><path d="M200 115 L200 315" stroke="${dark}" stroke-width="3"/><circle cx="200" cy="155" r="6" fill="${light}"/><circle cx="200" cy="185" r="6" fill="${light}"/><path d="M140 210 L175 210 M225 210 L260 210" stroke="${dark}" stroke-width="5"/>`;}
            else{body=`<path d="M155 72 L245 72 L275 155 L250 ${short?250:320} L150 ${short?250:320} L125 155 Z" fill="${col}" stroke="${dark}" stroke-width="4"/><path d="${neck}" fill="none" stroke="${light}" stroke-width="6"/><path d="M200 100 L200 ${short?245:310}" stroke="${light}" stroke-width="3" opacity=".8"/><path d="M150 190 Q200 215 250 190" fill="none" stroke="${light}" stroke-width="4" opacity=".7"/>`;}
            const detail=index%3===0?`<circle cx="185" cy="140" r="4" fill="${light}"/><circle cx="200" cy="155" r="4" fill="${light}"/><circle cx="215" cy="140" r="4" fill="${light}"/>`:(index%3===1?`<path d="M145 245 Q200 270 255 245" fill="none" stroke="${light}" stroke-width="5"/><path d="M155 260 Q200 285 245 260" fill="none" stroke="${light}" stroke-width="3"/>`:`<path d="M145 120 L120 145 M255 120 L280 145" stroke="${light}" stroke-width="5"/>`);
            return `<svg viewBox="0 0 400 380" xmlns="http://www.w3.org/2000/svg" aria-label="${type} design"><rect x="8" y="8" width="384" height="364" rx="28" fill="#faf9ff"/><text x="200" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="${dark}">${type}</text>${lower?'':sleeve}${body}${detail}<path d="M105 345 H295" stroke="${col}" stroke-width="8" stroke-linecap="round"/><circle cx="120" cy="345" r="5" fill="${dark}"/><circle cx="280" cy="345" r="5" fill="${dark}"/></svg>`;
          }
          '''

          s = s[:start] + new_visual + s[nxt:]
          s = s.replace('</head>', '<!-- SG_DESIGN_LIBRARY_V2 -->\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          print('Expanded all garment design choices and replaced generic icons with detailed design artwork.')

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add silai-guru.html
          git diff --cached --quiet && echo 'No changes to commit' && exit 0
          git commit -m 'Expand garment designs [skip design library]'
          git push
