name: Fix Silai Guru measurement position

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix measurement panel position
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('silai-guru-layout.js')
          s = p.read_text(encoding='utf-8')
          old = "panel.className='sg-measure-panel';\n      wrap.parentNode.insertBefore(panel,wrap.nextElementSibling);"
          new = "panel.className='sg-measure-panel';\n      const addButton=wrap.parentNode.querySelector('.add-g');\n      if(addButton) addButton.parentNode.insertBefore(panel,addButton.nextSibling);\n      else wrap.parentNode.insertBefore(panel,wrap.nextSibling);"
          if old not in s:
              raise SystemExit('Expected measurement insertion code not found')
          s = s.replace(old, new, 1)
          s = s.replace("Jis garment ki measurement bharni hai, usko select karein.", "Garments section ke baad yahan garment-wise measurements bharein.", 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add silai-guru-layout.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Place measurements below Add Another Garment'
            git push
          fi
