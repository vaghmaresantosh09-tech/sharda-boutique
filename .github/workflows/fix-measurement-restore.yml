name: Fix removable measurements

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Restore removed measurements') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch measurement restore
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('silai-guru.html')
          s = path.read_text(encoding='utf-8')

          old = r'''function refreshGarmentFields\(i\).*?function initGarments\(\)'''
          new = r'''function refreshGarmentFields(i){
            const card=document.getElementById('garment-'+i);if(!card)return;
            const type=card.dataset.selectedType||'Kurti';
            const old=Object.fromEntries(Array.from(card.querySelectorAll('.g-measure')).map(x=>[x.dataset.name,x.value]));
            let removed=[];try{removed=JSON.parse(card.dataset.removedMeasures||'[]')}catch(_){removed=[]}
            let removedValues={};try{removedValues=JSON.parse(card.dataset.removedValues||'{}')}catch(_){removedValues={}}
            const values=Object.assign({},removedValues,old);
            card.querySelector('.g-fields').innerHTML=orderMeasurementNames(type).filter(n=>!removed.includes(n)).map(n=>'<div class="field"><div style="display:flex;align-items:center;justify-content:space-between;gap:6px"><label>'+n+'</label><button type="button" class="remove-g sg-remove-measure" onclick="removeOrderMeasurement('+i+',this.dataset.name)" data-name="'+esc(n)+'" title="Remove this measurement">−</button></div><input class="g-measure" data-name="'+n+'" placeholder="inches" value="'+esc(values[n]||'')+'"></div>').join('');
            refreshMeasurementRestoreBox(i);
          }
          function refreshMeasurementRestoreBox(i){
            const card=document.getElementById('garment-'+i);if(!card)return;
            let removed=[];try{removed=JSON.parse(card.dataset.removedMeasures||'[]')}catch(_){removed=[]}
            let box=card.querySelector('.sg-restore-box');
            if(!removed.length){if(box)box.remove();return}
            if(!box){box=document.createElement('div');box.className='sg-restore-box';const grid=card.querySelector('.g-fields');grid.insertAdjacentElement('afterend',box)}
            box.innerHTML='<div class="sg-restore-title">↩️ Removed Measurements — वापस जोड़ें</div><div class="sg-restore-list">'+removed.map(n=>'<button type="button" class="sg-restore-btn" onclick="restoreOrderMeasurement('+i+',this.dataset.name)" data-name="'+esc(n)+'">＋ '+esc(n)+'</button>').join('')+'</div>';
          }
          function showRemovedMeasurements(i){
            const card=document.getElementById('garment-'+i);if(!card)return;
            const box=card.querySelector('.sg-restore-box');
            if(box){box.scrollIntoView({behavior:'smooth',block:'nearest'});return}
            alert('Abhi koi removed measurement nahi hai. Kisi measurement ke − button ko dabane ke baad use yahan se wapas add kar sakte hain.');
          }
          function removeOrderMeasurement(i,name){
            const card=document.getElementById('garment-'+i);if(!card)return;
            let removed=[];try{removed=JSON.parse(card.dataset.removedMeasures||'[]')}catch(_){removed=[]}
            let removedValues={};try{removedValues=JSON.parse(card.dataset.removedValues||'{}')}catch(_){removedValues={}}
            const input=Array.from(card.querySelectorAll('.g-measure')).find(x=>x.dataset.name===name);
            if(input)removedValues[name]=input.value||'';
            if(!removed.includes(name))removed.push(name);
            card.dataset.removedMeasures=JSON.stringify(removed);
            card.dataset.removedValues=JSON.stringify(removedValues);
            refreshGarmentFields(i);
          }
          function restoreOrderMeasurement(i,name){
            const card=document.getElementById('garment-'+i);if(!card)return;
            let removed=[];try{removed=JSON.parse(card.dataset.removedMeasures||'[]')}catch(_){removed=[]}
            removed=removed.filter(x=>x!==name);
            card.dataset.removedMeasures=JSON.stringify(removed);
            refreshGarmentFields(i);
          }
          function initGarments()'''

          ns, count = re.subn(old, new, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('measurement function block not found')

          # Add a dedicated restore button beside the garment Add/Remove controls.
          old_card = r'''<button type="button" class="secondary sg-add-garment" onclick="addGarment\(\)"\>＋ Add</button><button type="button" class="remove-g" onclick="removeGarment\((\+i)\)"\>− Remove</button>'''
          # Use a simple literal replacement because the source is minified but stable.
          ns = ns.replace(
              '<button type="button" class="secondary sg-add-garment" onclick="addGarment()">＋ Add</button><button type="button" class="remove-g" onclick="removeGarment('+"'"+'+i+'+"'"+')">− Remove</button>',
              '<button type="button" class="secondary sg-add-garment" onclick="addGarment()">＋ Add</button><button type="button" class="secondary sg-restore-measure" onclick="showRemovedMeasurements('+"'"+'+i+'+"'"+')">↩ Restore</button><button type="button" class="remove-g" onclick="removeGarment('+"'"+'+i+'+"'"+')">− Remove</button>'
          )

          # Add compact styles before </head>.
          styles = '<style id="sg-measure-restore">.sg-restore-measure{background:#eefbf4;color:#16704a;padding:8px 10px;font-size:12px}.sg-restore-box{margin-top:9px;padding:10px;border:1px dashed #b9ead1;background:#f4fff9;border-radius:12px}.sg-restore-title{font-size:12px;font-weight:800;color:#16704a;margin-bottom:7px}.sg-restore-list{display:flex;flex-wrap:wrap;gap:6px}.sg-restore-btn{background:#fff;border:1px solid #b9ead1;color:#16704a;padding:7px 9px;border-radius:10px;font-size:11px}</style>'
          if 'id="sg-measure-restore"' not in ns:
              ns = ns.replace('</head>', styles+'</head>', 1)

          path.write_text(ns, encoding='utf-8')
      - name: Commit patched file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add silai-guru.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore removed measurements"
          git push
