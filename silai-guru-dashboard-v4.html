<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SILAI GURU Dashboard</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6fb;color:#24243b}.top{background:linear-gradient(135deg,#5541dc,#7056e9);color:#fff;padding:22px 18px 28px;border-radius:0 0 28px 28px}.brand{font-size:25px;font-weight:800}.shop{font-size:20px;font-weight:800;margin-top:18px}.meta{opacity:.9;margin-top:5px}.wrap{max-width:900px;margin:auto}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:-18px 14px 20px}.stat{background:#fff;border-radius:17px;padding:15px;text-align:center;box-shadow:0 5px 18px #0001}.stat b{display:block;font-size:22px;color:#5541dc}.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 14px}.icon{background:#fff;border:0;border-radius:18px;padding:15px 7px;min-height:95px;box-shadow:0 4px 14px #00000012;font-size:28px}.icon:active{transform:scale(.97)}.icon span{display:block;font-size:12px;font-weight:700;margin-top:8px}.section{background:#fff;margin:20px 14px;padding:18px;border-radius:20px}.profile{font-size:14px;line-height:1.7;color:#5f6275}.bottom{position:sticky;bottom:0;background:#fff;border-top:1px solid #ddd;padding:12px;text-align:center;color:#666;font-size:13px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:5}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px}.sheet h2{margin:0 0 5px;color:#5541dc}.close{float:right;border:0;background:#eee;border-radius:50%;width:38px;height:38px;font-size:20px}.field{margin:12px 0}.field label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:13px;font-size:16px}.action{border:0;border-radius:14px;background:#5541dc;color:#fff;padding:14px 18px;font-size:16px;font-weight:700;width:100%;margin-top:8px}.list{padding:12px;background:#f7f7fb;border-radius:14px;margin:8px 0}.plan{border:1px solid #e2e2ee;border-radius:16px;padding:15px;margin:10px 0}.plan b{font-size:18px}.green{color:#16833b}.blue{color:#245bc7}.purple{color:#713dd1}.gold{color:#b27a00}@media(max-width:560px){.icons{grid-template-columns:repeat(4,1fr)}.icon{min-height:88px}.icon span{font-size:11px}.shop{font-size:18px}.sheet{padding:18px}}</style></head><body><div class="wrap"><header class="top"><div class="brand">✂️ SILAI GURU</div><div class="shop" id="shop"></div><div class="meta" id="meta"></div></header><div class="stats"><div class="stat"><b id="customerCount">0</b>Customers</div><div class="stat"><b id="orderCount">0</b>Orders</div><div class="stat"><b id="pendingAmount">₹0</b>Pending</div></div><div class="icons">
<button class="icon" onclick="openModule(0)">🧾<span>New Order</span></button><button class="icon" onclick="openModule(1)">👥<span>Customers</span></button><button class="icon" onclick="openModule(2)">📦<span>Orders</span></button><button class="icon" onclick="openModule(3)">📏<span>Measurements</span></button><button class="icon" onclick="openModule(4)">💰<span>Payments</span></button><button class="icon" onclick="openModule(5)">🚚<span>Delivery</span></button><button class="icon" onclick="openModule(6)">📊<span>Reports</span></button><button class="icon" onclick="openModule(7)">🏪<span>Shop Profile</span></button><button class="icon" onclick="openModule(8)">☁️<span>Backup</span></button><button class="icon" onclick="openModule(9)">👷<span>Workers</span></button><button class="icon" onclick="openModule(10)">👗<span>Garments</span></button><button class="icon" onclick="openModule(11)">⚙️<span>Settings</span></button><button class="icon" onclick="openModule(12)">💎<span>Plans & Upgrade</span></button>
</div><section class="section"><h3>Profile Saved ✅</h3><div class="profile" id="profile"></div></section><div class="bottom">Home &nbsp; • &nbsp; Customers &nbsp; • &nbsp; New Order &nbsp; • &nbsp; Orders</div></div>
<div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeModule()">×</button><div id="module"></div></div></div>
<script>
const p=new URLSearchParams(location.search),g=k=>p.get(k)||'', key='sg_orders_v4';let orders=JSON.parse(localStorage.getItem(key)||'[]');
document.getElementById('shop').textContent=(g('shop')||'My Shop')+' • '+(g('city')||'')+', '+(g('state')||'');document.getElementById('meta').textContent='Owner: '+(g('user')||'');document.getElementById('profile').innerHTML='<b>User:</b> '+g('user')+'<br><b>Mobile:</b> '+g('mobile')+'<br><b>Email:</b> '+g('email')+'<br><b>Address:</b> '+g('address')+'<br><b>Pincode:</b> '+g('pincode');
function refresh(){document.getElementById('orderCount').textContent=orders.length;document.getElementById('customerCount').textContent=new Set(orders.map(x=>x.mobile)).size;document.getElementById('pendingAmount').textContent='₹'+orders.reduce((s,x)=>s+(+x.total||0)-(+x.advance||0),0)}refresh();
const names=['New Order','Customers','Orders','Measurements','Payments','Delivery','Reports','Shop Profile','Backup','Workers','Garments','Settings','Plans & Upgrade'];
function openModule(n){let t=names[n],html='<h2>'+t+'</h2>';
if(n===0)html+=`<p>Customer aur order ek hi jagah se save karein.</p><div class="field"><label>Customer Name *</label><input id="cname" placeholder="Jaise: Rina Patel"></div><div class="field"><label>Mobile *</label><input id="cmobile" inputmode="numeric" placeholder="10 digit mobile"></div><div class="field"><label>Garment</label><select id="garment"><option>Kurti</option><option>Blouse</option><option>Pant</option><option>Dress</option><option>Shirt</option><option>Other</option></select></div><div class="field"><label>Delivery Date</label><input id="delivery" type="date"></div><div class="field"><label>Total Amount</label><input id="total" type="number" placeholder="0"></div><div class="field"><label>Advance</label><input id="advance" type="number" placeholder="0"></div><button class="action" onclick="saveOrder()">Save Order</button>`;
else if(n===1)html+=orders.length?orders.map(x=>'<div class="list"><b>'+x.name+'</b><br>📱 '+x.mobile+'<br>👗 '+x.garment+'</div>').join(''):'<p>Abhi koi customer nahi hai. New Order se customer add karein.</p>';
else if(n===2)html+=orders.length?orders.map((x,i)=>'<div class="list"><b>Order #'+(i+1)+' — '+x.name+'</b><br>'+x.garment+' • Delivery: '+(x.delivery||'Not set')+'<br>Total ₹'+x.total+' • Advance ₹'+x.advance+' • Balance ₹'+((+x.total||0)-(+x.advance||0))+'</div>').join(''):'<p>Abhi koi order nahi hai.</p>';
else if(n===3)html+='<p>Garment-wise measurement register.</p>'+['Height','Shoulder','Chest','Waist','Hip','Sleeve','Neck Front','Neck Back','Armhole','Thigh','Mori'].map(x=>'<div class="field"><label>'+x+'</label><input placeholder="'+x+'"></div>').join('')+'<button class="action" onclick="closeModule()">Save Measurement</button>';
else if(n===4)html+='<div class="list">💰 Total Sales<br><b>₹'+orders.reduce((s,x)=>s+(+x.total||0),0)+'</b></div><div class="list">💵 Advance Received<br><b>₹'+orders.reduce((s,x)=>s+(+x.advance||0),0)+'</b></div><div class="list">⏳ Pending<br><b>₹'+orders.reduce((s,x)=>s+(+x.total||0)-(+x.advance||0),0)+'</b></div>';
else if(n===5)html+=orders.filter(x=>x.delivery).length?orders.filter(x=>x.delivery).map(x=>'<div class="list">🚚 <b>'+x.name+'</b><br>Delivery: '+x.delivery+'<br>'+x.garment+'</div>').join(''):'<p>Delivery list abhi empty hai.</p>';
else if(n===6)html+='<div class="list">👥 Customers: <b>'+new Set(orders.map(x=>x.mobile)).size+'</b></div><div class="list">📦 Orders: <b>'+orders.length+'</b></div><div class="list">💰 Sales: <b>₹'+orders.reduce((s,x)=>s+(+x.total||0),0)+'</b></div><div class="list">⏳ Pending: <b>₹'+orders.reduce((s,x)=>s+(+x.total||0)-(+x.advance||0),0)+'</b></div>';
else if(n===7)html+='<div class="list"><b>Shop:</b> '+g('shop')+'<br><b>Owner:</b> '+g('user')+'<br><b>Mobile:</b> '+g('mobile')+'<br><b>Address:</b> '+g('address')+'<br>'+g('city')+', '+g('state')+' - '+g('pincode')+'</div><button class="action" onclick="closeModule()">Close</button>';
else if(n===8)html+='<div class="list">☁️ Free plan: 1 GB SILAI GURU cloud backup concept.</div><div class="list">Last backup: Demo mode</div><button class="action" onclick="alert(\'Real cloud backup next development step me connect hoga\')">Backup Now</button>';
else if(n===9)html+='<p>Workers / Karigar management</p><div class="field"><label>Worker Name</label><input placeholder="Worker name"></div><div class="field"><label>Mobile</label><input placeholder="Mobile"></div><button class="action" onclick="closeModule()">Save Worker</button>';
else if(n===10)html+='<div class="list">👗 Kurti — measurements + design</div><div class="list">👚 Blouse — measurements + design</div><div class="list">👖 Pant — measurements + design</div><div class="list">👗 Dress — measurements + design</div>';
else if(n===11)html+='<div class="list">🔔 Delivery reminder<br>2 din pehle reminder concept</div><div class="list">🏪 Shop profile settings</div><div class="list">🌐 Language / app preferences</div>';
else html+='<div class="plan"><b class="green">🟢 FREE — ₹0</b><br>Basic customers, orders, measurements, dashboard<br>1 GB cloud backup concept</div><div class="plan"><b class="blue">🔵 STANDARD — ₹149/month</b><br>5 GB SILAI GURU cloud + restore + normal WhatsApp bill</div><div class="plan"><b class="purple">🟣 PREMIUM — ₹249/month</b><br>10 GB SILAI GURU cloud + restore + shop name/address bill</div><div class="plan"><b class="gold">👑 PREMIUM PRO — ₹449/month</b><br>25 GB + automatic Google Drive backup + advanced WhatsApp bill</div>';
document.getElementById('module').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModule(){document.getElementById('modal').classList.remove('show')}
function saveOrder(){let name=document.getElementById('cname').value.trim(),mobile=document.getElementById('cmobile').value.trim();if(!name||!mobile){alert('Customer Name aur Mobile bhariye');return}let x={name,mobile,garment:document.getElementById('garment').value,delivery:document.getElementById('delivery').value,total:document.getElementById('total').value||0,advance:document.getElementById('advance').value||0};orders.push(x);localStorage.setItem(key,JSON.stringify(orders));refresh();closeModule();alert('Order saved ✅')}
</script></body></html>
