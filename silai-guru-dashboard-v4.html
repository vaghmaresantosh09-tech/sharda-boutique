<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SILAI GURU Dashboard</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6fb;color:#24243b}.top{background:linear-gradient(135deg,#5541dc,#7056e9);color:#fff;padding:22px 18px 28px;border-radius:0 0 28px 28px}.brand{font-size:25px;font-weight:800}.shop{font-size:20px;font-weight:800;margin-top:18px}.meta{opacity:.9;margin-top:5px}.wrap{max-width:900px;margin:auto}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:-18px 14px 20px}.stat{background:#fff;border-radius:17px;padding:15px;text-align:center;box-shadow:0 5px 18px #0001}.stat b{display:block;font-size:22px;color:#5541dc}.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 14px}.icon{background:#fff;border:0;border-radius:18px;padding:15px 7px;min-height:95px;box-shadow:0 4px 14px #00000012;font-size:28px}.icon span{display:block;font-size:12px;font-weight:700;margin-top:8px}.section{background:#fff;margin:20px 14px;padding:18px;border-radius:20px}.section h3{margin:0 0 8px}.profile{font-size:14px;line-height:1.7;color:#5f6275}.bottom{position:sticky;bottom:0;background:#fff;border-top:1px solid #ddd;padding:12px;text-align:center;color:#666;font-size:13px}@media(max-width:560px){.icons{grid-template-columns:repeat(4,1fr)}.icon{min-height:88px}.icon span{font-size:11px}.shop{font-size:18px}}</style></head><body><div class="wrap"><header class="top"><div class="brand">✂️ SILAI GURU</div><div class="shop" id="shop"></div><div class="meta" id="meta"></div></header><div class="stats"><div class="stat"><b>0</b>Customers</div><div class="stat"><b>0</b>Orders</div><div class="stat"><b>₹0</b>Pending</div></div><div class="icons">
<button class="icon" onclick="alert('New Order screen — next step me full working module banega')">🧾<span>New Order</span></button><button class="icon" onclick="alert('Customers screen — next step me full working module banega')">👥<span>Customers</span></button><button class="icon" onclick="alert('Orders screen — next step me full working module banega')">📦<span>Orders</span></button><button class="icon" onclick="alert('Measurements screen — next step me full working module banega')">📏<span>Measurements</span></button><button class="icon" onclick="alert('Payments screen — next step me full working module banega')">💰<span>Payments</span></button><button class="icon" onclick="alert('Delivery screen — next step me full working module banega')">🚚<span>Delivery</span></button><button class="icon" onclick="alert('Reports screen — next step me full working module banega')">📊<span>Reports</span></button><button class="icon" onclick="alert('Shop Profile screen — next step me full working module banega')">🏪<span>Shop Profile</span></button><button class="icon" onclick="alert('Backup screen — next step me full working module banega')">☁️<span>Backup</span></button><button class="icon" onclick="alert('Workers screen — next step me full working module banega')">👷<span>Workers</span></button><button class="icon" onclick="alert('Garments screen — next step me full working module banega')">👗<span>Garments</span></button><button class="icon" onclick="alert('Settings screen — next step me full working module banega')">⚙️<span>Settings</span></button><button class="icon" onclick="alert('Plans & Upgrade screen — next step me full working module banega')">💎<span>Plans & Upgrade</span></button>
</div><section class="section"><h3>Profile Saved ✅</h3><div class="profile" id="profile"></div></section><div class="bottom">Home &nbsp; • &nbsp; Customers &nbsp; • &nbsp; New Order &nbsp; • &nbsp; Orders</div></div>
<script>
const p=new URLSearchParams(location.search);const g=k=>p.get(k)||'';document.getElementById('shop').textContent=(g('shop')||'My Shop')+' • '+(g('city')||'')+', '+(g('state')||'');document.getElementById('meta').textContent='Owner: '+(g('user')||'');document.getElementById('profile').innerHTML='<b>User:</b> '+g('user')+'<br><b>Mobile:</b> '+g('mobile')+'<br><b>Email:</b> '+g('email')+'<br><b>Address:</b> '+g('address')+'<br><b>Pincode:</b> '+g('pincode');
</script></body></html>
