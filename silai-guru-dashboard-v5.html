<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SILAI GURU</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5fb;color:#20213a}.top{background:linear-gradient(135deg,#5541dc,#7358eb);color:white;padding:24px 18px 32px;border-radius:0 0 30px 30px}.brand{font-size:26px;font-weight:800}.shop{font-size:19px;font-weight:800;margin-top:18px}.meta{margin-top:5px;opacity:.9}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:-18px 14px 20px}.stat{background:white;border-radius:18px;padding:15px;text-align:center;box-shadow:0 5px 18px #0001}.stat b{display:block;color:#5541dc;font-size:22px}.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 14px}.icon{border:0;background:white;border-radius:18px;min-height:96px;padding:12px 5px;box-shadow:0 4px 15px #0001;font-size:29px}.icon span{display:block;font-size:12px;font-weight:700;margin-top:7px;color:#171725}.icon:active{transform:scale(.96)}.profile{background:white;margin:22px 14px;padding:20px;border-radius:20px;line-height:1.8}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.modal.open{display:flex}.sheet{background:white;width:100%;max-height:90vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px}.close{float:right;border:0;border-radius:50%;width:40px;height:40px;font-size:24px}.sheet h2{color:#5541dc}.field{margin:12px 0}.field label{font-weight:700;font-size:14px;display:block;margin-bottom:5px}.field input,.field select{width:100%;padding:13px;border:1px solid #ddd;border-radius:13px;font-size:16px}.action{width:100%;border:0;border-radius:14px;padding:14px;background:#5541dc;color:white;font-weight:700;font-size:16px;margin-top:8px}.item{background:#f7f7fb;border-radius:14px;padding:13px;margin:9px 0}.bottom{text-align:center;background:white;padding:14px;color:#666;margin-top:20px}@media(max-width:560px){.icons{grid-template-columns:repeat(4,1fr)}.icon{min-height:88px}.icon span{font-size:11px}}</style></head><body>
<header class="top"><div class="brand">✂️ SILAI GURU</div><div class="shop" id="shop"></div><div class="meta" id="owner"></div></header>
<div class="stats"><div class="stat"><b id="cc">0</b>Customers</div><div class="stat"><b id="oc">0</b>Orders</div><div class="stat"><b id="pa">₹0</b>Pending</div></div>
<div class="icons" id="icons"></div>
<div class="profile"><h2>Profile Saved ✅</h2><div id="profile"></div></div>
<div class="bottom">Home • Customers • New Order • Orders</div>
<div class="modal" id="modal"><div class="sheet"><button class="close" id="close">×</button><div id="content"></div></div></div>
<script>
(function(){
var q=new URLSearchParams(location.search), get=function(k){return q.get(k)||''};
document.getElementById('shop').textContent=(get('shop')||'My Shop')+' • '+(get('city')||'')+', '+(get('state')||'');
document.getElementById('owner').textContent='Owner: '+(get('user')||'');
document.getElementById('profile').innerHTML='<b>User:</b> '+get('user')+'<br><b>Mobile:</b> '+get('mobile')+'<br><b>Email:</b> '+get('email')+'<br><b>Address:</b> '+get('address')+'<br><b>Pincode:</b> '+get('pincode');
var names=['New Order','Customers','Orders','Measurements','Payments','Delivery','Reports','Shop Profile','Backup','Workers','Garments','Settings','Plans & Upgrade'];
var icons=['🧾','👥','📦','📏','💰','🚚','📊','🏪','☁️','👷','👗','⚙️','💎'];
var data=[];try{data=JSON.parse(localStorage.getItem('sg_orders_v5')||'[]')}catch(e){data=[]}
function stats(){document.getElementById('oc').textContent=data.length;var m={};var pending=0;for(var i=0;i<data.length;i++){m[data[i].mobile]=1;pending+=(Number(data[i].total)||0)-(Number(data[i].advance)||0)}document.getElementById('cc').textContent=Object.keys(m).length;document.getElementById('pa').textContent='₹'+pending}
function show(n){
var html='<h2>'+names[n]+'</h2>';
if(n===0){html+='<p>Ek customer ke liye multiple garments aur har garment ki alag measurement.</p><div class="field"><label>Customer Name *</label><input id="cn"></div><div class="field"><label>Mobile *</label><input id="cm" inputmode="numeric"></div><div id="gb"></div><button class="action" id="addg">＋ Add Another Garment</button><div class="field"><label>Delivery Date</label><input id="dd" type="date"></div><div class="field"><label>Total Amount</label><input id="tot" type="number"></div><div class="field"><label>Advance</label><input id="adv" type="number"></div><button class="action" id="save">Save Customer & Order</button>'}
else if(n===1){if(!data.length)html+='<p>No customers yet.</p>';else for(var i=0;i<data.length;i++){html+='<div class="item"><b>'+data[i].name+'</b><br>📱 '+data[i].mobile+'<br>';for(var j=0;j<data[i].garments.length;j++){html+='👗 '+data[i].garments[j].name+'<br>'}html+='<button class="action" data-add="'+i+'">＋ Add Garment</button></div>'}}
else if(n===2){if(!data.length)html+='<p>No orders yet.</p>';else for(var i=0;i<data.length;i++)html+='<div class="item"><b>Order '+(i+1)+' — '+data[i].name+'</b><br>'+data[i].garments.map(function(g){return '👗 '+g.name}).join(' • ')+'<br>Delivery: '+(data[i].delivery||'Not set')+'<br>Total ₹'+data[i].total+' • Advance ₹'+data[i].advance+' • Balance ₹'+((Number(data[i].total)||0)-(Number(data[i].advance)||0))+'</div>'}
else if(n===3)html+='<p>Garment-wise measurement register.</p>'+['Height','Shoulder','Armhole','Upper Chest','Chest','Waist','Hip','Neck Front','Neck Back','Sleeve','Thigh','Mori'].map(function(x){return '<div class="field"><label>'+x+'</label><input></div>'}).join('')+'<button class="action" id="close2">Save Measurement</button>';
else if(n===4)html+='<div class="item">Total Sales: ₹'+data.reduce(function(s,x){return s+(Number(x.total)||0)},0)+'</div><div class="item">Advance: ₹'+data.reduce(function(s,x){return s+(Number(x.advance)||0)},0)+'</div><div class="item">Pending: ₹'+data.reduce(function(s,x){return s+(Number(x.total)||0)-(Number(x.advance)||0)},0)+'</div>';
else if(n===5)html+='<p>Delivery list</p>'+data.filter(function(x){return x.delivery}).map(function(x){return '<div class="item">🚚 '+x.name+'<br>'+x.delivery+' • '+x.garments.map(function(g){return g.name}).join(', ')+'</div>'}).join('');
else if(n===6)html+='<div class="item">Customers: '+document.getElementById('cc').textContent+'</div><div class="item">Orders: '+data.length+'</div><div class="item">Pending: ₹'+document.getElementById('pa').textContent.replace('₹','')+'</div>';
else if(n===7)html+='<div class="item"><b>Shop:</b> '+get('shop')+'<br><b>Owner:</b> '+get('user')+'<br><b>Mobile:</b> '+get('mobile')+'<br><b>Address:</b> '+get('address')+'<br>'+get('city')+', '+get('state')+' - '+get('pincode')+'</div>';
else if(n===8)html+='<div class="item">☁️ Free plan: 1 GB cloud backup concept.</div><button class="action" id="backup">Backup Now</button>';
else if(n===9)html+='<div class="field"><label>Worker Name</label><input></div><div class="field"><label>Mobile</label><input></div><button class="action">Save Worker</button>';
else if(n===10)html+='<div class="item">👗 Kurti — measurements & design</div><div class="item">👚 Blouse — measurements & design</div><div class="item">👖 Pant — measurements & design</div>';
else if(n===11)html+='<div class="item">🔔 Delivery reminder: 2 days before delivery</div><div class="item">🏪 Shop settings</div>';
else html+='<div class="item"><b>🟢 FREE — ₹0</b><br>Basic use + 1 GB backup</div><div class="item"><b>🔵 STANDARD — ₹149/month</b><br>5 GB SILAI GURU cloud + restore</div><div class="item"><b>🟣 PREMIUM — ₹249/month</b><br>10 GB SILAI GURU cloud + restore</div><div class="item"><b>👑 PREMIUM PRO — ₹449/month</b><br>25 GB + Google Drive backup</div>';
document.getElementById('content').innerHTML=html;document.getElementById('modal').className='modal open';
if(n===0){addGarment();document.getElementById('addg').onclick=addGarment;document.getElementById('save').onclick=save}
}
function addGarment(){var box=document.getElementById('gb'),d=document.createElement('div');d.className='item garment';d.innerHTML='<b>Garment</b><div class="field"><label>Garment Type</label><select><option>Kurti</option><option>Blouse</option><option>Pant</option><option>Dress</option><option>Shirt</option><option>Other</option></select></div><div class="measure"></div><button class="action remove">− Remove Garment</button>';box.appendChild(d);renderMeasures(d);d.querySelector('select').onchange=function(){renderMeasures(d)};d.querySelector('.remove').onclick=function(){d.remove()}}
function renderMeasures(d){var type=d.querySelector('select').value,fields=type==='Pant'?['Height','Hip','Thigh','Mori']:type==='Blouse'?['Height','Shoulder','Armhole','Upper Chest','Chest','Waist','Neck Front','Neck Back','Sleeve']:['Height','Shoulder','Armhole','Upper Chest','Chest','Waist','Hip','Neck Front','Neck Back','Sleeve'];d.querySelector('.measure').innerHTML=fields.map(function(x){return '<div class="field"><label>'+x+'</label><input data-m="'+x+'"></div>'}).join('')}
function save(){var gs=[];document.querySelectorAll('.garment').forEach(function(d){var ms={};d.querySelectorAll('[data-m]').forEach(function(x){ms[x.getAttribute('data-m')]=x.value});gs.push({name:d.querySelector('select').value,measurements:ms})});var name=document.getElementById('cn').value.trim(),mobile=document.getElementById('cm').value.trim();if(!name||!mobile||!gs.length){alert('Customer Name, Mobile aur kam se kam 1 garment bhariye');return}data.push({name:name,mobile:mobile,garments:gs,delivery:document.getElementById('dd').value,total:document.getElementById('tot').value||0,advance:document.getElementById('adv').value||0});localStorage.setItem('sg_orders_v5',JSON.stringify(data));stats();document.getElementById('modal').className='modal';alert('Customer & order saved ✅')}
document.getElementById('icons').innerHTML=icons.map(function(ic,i){return '<button class="icon" data-n="'+i+'">'+ic+'<span>'+names[i]+'</span></button>'}).join('');
document.querySelectorAll('.icon').forEach(function(b){b.addEventListener('click',function(){show(Number(b.getAttribute('data-n')))});});
document.getElementById('close').addEventListener('click',function(){document.getElementById('modal').className='modal'});
stats();
})();</script></body></html>
