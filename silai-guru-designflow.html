<!doctype html><html lang="hi"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SILAI GURU</title><style>:root{--p:#5b4bdb;--bg:#f7f7fb;--t:#202238;--m:#74798c;--l:#e4e5ef}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--bg);color:var(--t)}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:11px;font-weight:800}.app{max-width:820px;margin:auto;padding-bottom:80px}.hero{background:linear-gradient(135deg,#5b4bdb,#8267f5);color:#fff;padding:20px 16px 24px;border-radius:0 0 25px 25px}.brand{font-size:28px;font-weight:900}.wrap{padding:14px}.card,.g{background:#fff;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 4px 15px #2221}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f0efff;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:20px}.muted{color:var(--m);font-size:12px}.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.ico{background:#fff;border:1px solid var(--l);min-height:85px}.ico i{font-style:normal;font-size:27px;display:block}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);z-index:20}.bottomin{max-width:820px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav{background:none;color:var(--m)}.modal{position:fixed;inset:0;background:#0008;z-index:50;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:820px;margin:auto;border-radius:24px 24px 0 0;padding:18px;max-height:94vh;overflow:auto}.close{float:right;background:#eee}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:flex;flex-direction:column;gap:4px}.full{grid-column:1/-1}label{font-size:12px;font-weight:800}input,select,textarea{width:100%;padding:11px;border:1px solid var(--l);border-radius:10px}.primary{background:var(--p);color:#fff;width:100%;margin-top:9px}.secondary{background:#efeeff;color:#4f43b5}.danger{background:#ffe9e9;color:#a71d2a}.banner{background:#fff1cf;color:#765500;padding:11px;border-radius:12px;text-align:center;font-size:12px;font-weight:800}.g{background:#faf9ff;border:1px solid #ddd8ff;box-shadow:none}.ghead{display:flex;justify-content:space-between;gap:7px;align-items:center}.gt{font-weight:900;color:#5144bd}.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.workspace{background:#fff;border:1px solid #ddd8ff;border-radius:15px;padding:11px;margin-top:11px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.action{background:#f3f1ff;color:#5144b5;min-height:72px}.action b{display:block;font-size:24px}.panel{display:none;margin-top:10px}.panel.show{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.d{border:1px solid var(--l);border-radius:13px;overflow:hidden;background:#fff}.dimg{height:125px;background:#faf9ff}.dimg img{width:100%;height:100%;object-fit:cover}.dn{font-size:11px;font-weight:900;padding:7px}.da{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:5px}.da button{font-size:10px;padding:7px}.sources{display:grid;grid-template-columns:1fr 1fr;gap:8px}.source{border:1px solid var(--l);border-radius:13px;padding:11px}.source small{display:block;color:var(--m);margin:5px 0 8px}.selected{background:#effff5;border:1px solid #b9e8cf;border-radius:12px;padding:9px;margin-top:8px}.selected img{width:60px;height:60px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:8px}.row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--l)}.empty{text-align:center;color:var(--m);padding:25px}@media(max-width:600px){.form{grid-template-columns:1fr}.full{grid-column:auto}.actions{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}</style><div class="app"><header class="hero"><div class="brand">✂️ SILAI GURU</div><div id="shop"></div><small id="owner"></small></header><div class="wrap"><div class="card"><div class="stats"><div class="stat"><b id="nc">0</b>Customers</div><div class="stat"><b id="no">0</b>Orders</div><div class="stat"><b id="bal">₹0</b>Pending</div></div></div><div id="ad" class="banner"></div><div class="card"><h2>Dashboard</h2><div id="icons" class="icons"></div></div><div class="card"><h2>Recent Orders</h2><div id="recent"></div></div></div></div><div class="bottom"><div class="bottomin"><button class="nav" onclick="closeM()">⌂<br>Home</button><button class="nav" onclick="openM('customers')">👥<br>Customers</button><button class="nav" onclick="openM('order')">＋<br>New Order</button><button class="nav" onclick="openM('orders')">📋<br>Orders</button></div></div><div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeM()">✕</button><h2 id="title"></h2><div id="body"></div></div></div><script>const K='sg_profile',CK='sg_customers',OK='sg_orders',PK='sg_plan';let p=JSON.parse(localStorage.getItem(K)||'null'),cs=JSON.parse(localStorage.getItem(CK)||'[]'),os=JSON.parse(localStorage.getItem(OK)||'[]'),plan=localStorage.getItem(PK)||'free';const G=['Kurti','Blouse','Pant','Plazo','Salwar','Salwar Suit','Shirt','Blazer','Kameez','Saree Blouse','Lehenga','Gown','Dress','Choli','Sherwani','Suit','Waistcoat','Pajama','School Uniform','Coat','Other'];const M={Kurti:['Height','Shoulder','Armhole','Upper Chest','Chest','Waist','Hip','Neck Front','Neck Back','Sleeve'],Blouse:['Height','Shoulder','Armhole','Upper Chest','Chest','Waist','Neck Front','Neck Back','Sleeve'],Pant:['Height','Hip','Thigh','Mori'],Plazo:['Height','Waist','Hip','Thigh','Mori'],Salwar:['Height','Waist','Hip','Thigh','Mori'],Shirt:['Height','Shoulder','Armhole','Chest','Waist','Hip','Sleeve','Collar'],Blazer:['Height','Shoulder','Chest','Waist','Hip','Sleeve'],Dress:['Height','Shoulder','Armhole','Chest','Waist','Hip','Sleeve'],Other:['Height','Shoulder','Chest','Waist','Hip','Sleeve']};const D={Kurti:['Straight Kurti','A-Line Kurti','Anarkali Kurti','Angrakha Kurti','Long Kurti','Rayon Kurti','Palazzo Kurti','High Low Kurti','Cotton Kurti','Party Wear Kurti','Short Kurti','Flared Kurti','Embroidered Kurti','Printed Kurti'],Blouse:['Padded Blouse','Princess Cut Blouse','Boat Neck Blouse','Back Open Blouse','Patch Work Blouse','Silk Blouse','Collar Neck Blouse','Deep Neck Blouse','Elbow Sleeve Blouse','Cold Shoulder Blouse','High Neck Blouse','Net Blouse','Peplum Blouse'],Pant:['Straight Pant','Cigarette Pant','Wide Leg Pant','Palazzo Pant','Culotte Pant','Ankle Pant','Bootcut Pant'],Plazo:['Basic Plazo','Printed Plazo','Flared Plazo','Layered Plazo','Straight Plazo','Designer Plazo'],Salwar:['Patiala Salwar','Plain Salwar','Dhoti Salwar','Afghani Salwar','Designer Salwar'],Shirt:['Classic Shirt','Slim Fit Shirt','Regular Shirt','Mandarin Collar','Cuban Collar','Half Sleeve Shirt','Full Sleeve Shirt','Kurta Style Shirt'],Blazer:['Single Breasted Blazer','Double Breasted Blazer','Long Blazer','Cropped Blazer','Designer Blazer'],Dress:['Maxi Dress','Anarkali Dress','A-Line Dress','Flared Dress','Midi Dress','Party Dress'],default:['Classic','Designer','Party Wear','Traditional','Modern','Embroidered','Printed','Custom Design']};const imgs=['https://images.unsplash.com/photo-1525507119028-ed4c629a60a3?auto=format&fit=crop&w=500&q=70','https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?auto=format&fit=crop&w=500&q=70','https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=500&q=70'];const mods=[['🧾','New Order','order'],['👥','Customers','customers'],['📋','Orders','orders'],['📏','Measurements','measure'],['💰','Payments','pay'],['🚚','Delivery','delivery'],['📊','Reports','report'],['🏪','Shop Profile','profile'],['☁️','Backup','backup'],['👗','Garments','garments'],['💎','Plans','plans'],['⚙️','Settings','settings']];function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(x){return'₹'+Number(x||0).toLocaleString('en-IN')}function save(){localStorage.setItem(CK,JSON.stringify(cs));localStorage.setItem(OK,JSON.stringify(os))}function render(){if(!p)return;shop.textContent=(p.shop||'My Shop')+' • '+(p.city||'')+', '+(p.state||'');owner.textContent='Owner: '+p.name+' • Plan: '+plan.toUpperCase();nc.textContent=cs.length;no.textContent=os.length;let b=os.reduce((s,o)=>s+Math.max(0,+o.total-(+o.advance||0)),0);bal.textContent=money(b);ad.textContent=plan==='free'?'ADVERTISEMENT · FREE PLAN':'✓ '+plan.toUpperCase()+' · DESIGN + CAMERA + GALLERY';recent.innerHTML=os.slice(-5).reverse().map(o=>'<div class="row"><span><b>'+esc(o.customer)+'</b><br><small>'+esc(o.garment)+' • '+esc(o.delivery)+'</small></span><b>'+money(o.total)+'</b></div>').join('')||'<div class="empty">अभी कोई order नहीं है।</div>';icons.innerHTML=mods.map(x=>'<button class="ico" onclick="openM(\''+x[2]+'\')"><i>'+x[0]+'</i><small>'+x[1]+'</small></button>').join('')}function openM(t){modal.classList.add('show');title.textContent=({order:'➕ New Order',customers:'👥 Customers',orders:'📋 Orders',measure:'📏 Measurements',pay:'💰 Payments',delivery:'🚚 Delivery',report:'📊 Reports',profile:'🏪 Shop Profile',backup:'☁️ Backup',garments:'👗 Garments',plans:'💎 Plans',settings:'⚙️ Settings'})[t];body.innerHTML=content(t)}function closeM(){modal.classList.remove('show')}function content(t){if(t==='order'){setTimeout(()=>addGarment(),0);return '<form onsubmit="saveOrder(event)"><div class="form"><div class="field"><label>Customer Name *</label><input id="cn" required></div><div class="field"><label>Mobile *</label><input id="cm" required></div></div><h3>Garments & Measurements</h3><p class="muted">Ab har garment ke andar usi garment ki Design Library + Camera + Gallery + Websites hain.</p><div id="gb"></div><button type="button" class="secondary" style="width:100%" onclick="addGarment()">＋ Add Another Garment</button><div class="form" style="margin-top:10px"><div class="field"><label>Work Taken Date</label><input id="wd" type="date"></div><div class="field"><label>Delivery Date *</label><input id="dd" type="date" required></div><div class="field"><label>Total ₹</label><input id="tot" type="number"></div><div class="field"><label>Advance ₹</label><input id="adv" type="number" value="0"></div><div class="field full"><label>Notes</label><textarea id="note"></textarea></div></div><button class="primary">💾 Save Customer & Order</button></form>'}if(t==='customers')return'<input id="search" placeholder="🔎 Search name/mobile" oninput="filterC()"><div id="cl">'+cs.map(c=>'<div class="row"><span><b>'+esc(c.name)+'</b><br><small>'+esc(c.mobile)+' • '+(c.orders||0)+' orders</small></span></div>').join('')||'<div class="empty">No customers</div></div>';if(t==='orders')return os.slice().reverse().map(o=>'<div class="card"><b>'+esc(o.customer)+'</b><br><small>'+esc(o.mobile)+' • '+esc(o.delivery)+'</small>'+(o.garments||[]).map(g=>'<div class="row"><span>'+esc(g.type)+'</span><span>'+esc(g.design?.name||'No design')+'</span></div>').join('')+'</div>').join('')||'<div class="empty">No orders</div>';if(t==='garments')return'<div class="banner">Garment types yahan manage honge. Design selection sirf New Order ke selected garment ke andar hai.</div>'+G.map(x=>'<div class="row"><span>👗 '+x+'</span><small>New Order → garment → designs</small></div>').join('');if(t==='plans')return['free','standard','premium','pro'].map(x=>'<div class="card"><h3>'+x.toUpperCase()+'</h3><div class="row"><span>Design Library</span><b>ON</b></div><div class="row"><span>Camera</span><b>ON</b></div><div class="row"><span>Gallery</span><b>ON</b></div><button class="primary" onclick="plan=\''+x+'\';localStorage.setItem(PK,plan);closeM();render()">Use '+x.toUpperCase()+'</button></div>').join('');if(t==='profile')return'<div class="row"><span>Shop</span><b>'+esc(p.shop)+'</b></div><div class="row"><span>Owner</span><b>'+esc(p.name)+'</b></div><div class="row"><span>Mobile</span><b>'+esc(p.mobile)+'</b></div><div class="row"><span>Address</span><b>'+esc(p.address)+'</b></div>';if(t==='pay')return'<div class="row"><span>Total</span><b>'+money(os.reduce((s,o)=>s+ +o.total,0))+'</b></div><div class="row"><span>Advance</span><b>'+money(os.reduce((s,o)=>s+ +o.advance,0))+'</b></div><div class="row"><span>Pending</span><b>'+bal.textContent+'</b></div>';if(t==='backup')return'<div class="card"><b>☁️ '+plan.toUpperCase()+'</b><p class="muted">Design photos aur orders current browser storage me demo ke liye save hote hain.</p></div>';return'<div class="empty">Module ready.</div>'}function fields(type){return(M[type]||M.Other).map(x=>'<div class="field"><label>'+x+'</label><input class="mi" data-n="'+x+'" placeholder="inches"></div>').join('')}function addGarment(){let w=document.getElementById('gb');if(!w)return;let i=w.children.length;w.insertAdjacentHTML('beforeend',garment(i,'Kurti'))}function garment(i,type){return'<div class="g" id="g'+i+'"><div class="ghead"><span class="gt">👗 Garment '+(i+1)+'</span><button type="button" class="danger" onclick="this.closest(\'.g\').remove()">Remove</button></div><div class="field"><label>Garment Type</label><select class="gtp" onchange="changeG(this,'+i+')">'+G.map(x=>'<option '+(x===type?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="mg">'+fields(type)+'</div><div class="workspace"><b>🎨 <span class="wname">'+type+'</span> Design</b><div class="muted">Sirf is garment ke designs.</div><div class="actions"><button type="button" class="action" onclick="panel('+i+',\'lib\')"><b>🎨</b>Library</button><button type="button" class="action" onclick="panel('+i+',\'cam\')"><b>📷</b>Camera</button><button type="button" class="action" onclick="panel('+i+',\'gal\')"><b>🖼️</b>Gallery</button><button type="button" class="action" onclick="panel('+i+',\'web\')"><b>🌐</b>Websites</button></div><div id="p'+i+'" class="panel"></div><div id="sel'+i+'"></div></div></div>'}function changeG(s,i){let g=document.getElementById('g'+i),type=s.value;g.querySelector('.gt').textContent='👗 Garment';g.querySelector('.mg').innerHTML=fields(type);g.querySelector('.wname').textContent=type;g.querySelector('.panel').innerHTML='';g.querySelector('.panel').classList.remove('show');g.dataset.design=''}function panel(i,mode){let g=document.getElementById('g'+i),type=g.querySelector('.gtp').value,p=document.getElementById('p'+i);p.classList.add('show');if(mode==='lib'){let a=D[type]||D.default;p.innerHTML='<div class="grid">'+a.map((n,k)=>'<div class="d"><div class="dimg"><img src="'+imgs[k%3]+'" loading="lazy"></div><div class="dn">'+n+'</div><div class="da"><button class="secondary" type="button" onclick="alert(\''+n+' • '+type+'\')">👁️ Show</button><button class="primary" type="button" onclick="selectD('+i+',\''+n.replace(/'/g,"\\'")+'\',\''+type+'\',\''+imgs[k%3]+'\',\'Silai Guru Library\')">✓ Select</button></div></div>').join('')+'</div>';return}if(mode==='cam'||mode==='gal'){p.innerHTML='<b>'+(mode==='cam'?'📷 Camera':'🖼️ Gallery')+' — '+type+'</b><p class="muted">Photo select karte hi isi garment ke design me save hogi.</p><input type="file" accept="image/*" '+(mode==='cam'?'capture="environment"':'')+' onchange="photoD('+i+',this)">';return}let q=encodeURIComponent(type+' garment designs'),s=[['Pinterest','https://www.pinterest.com/search/pins/?q='+q],['Myntra','https://www.myntra.com/search?q='+q],['Meesho','https://www.meesho.com/search?q='+q],['Google Images','https://www.google.com/search?tbm=isch&q='+q]];p.innerHTML='<div class="sources">'+s.map(x=>'<div class="source"><b>🌐 '+x[0]+'</b><small>'+type+' designs</small><button class="secondary" type="button" onclick="window.open(\''+x[1]+'\',\'_blank\')">Open Website ↗</button></div>').join('')+'</div><div class="source" style="margin-top:8px"><b>🔗 Website Design Link</b><input id="u'+i+'" placeholder="https://..."><button class="primary" type="button" onclick="urlD('+i+')">Save Design Link</button></div>'}function selectD(i,n,t,img,src){let g=document.getElementById('g'+i);g.dataset.design=JSON.stringify({name:n,type:t,image:img,source:src});document.getElementById('sel'+i).innerHTML='<div class="selected"><img src="'+img+'"><b>✓ '+n+'</b><br><small>'+src+' • '+t+'</small></div>'}function photoD(i,input){let f=input.files&&input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let g=document.getElementById('g'+i),t=g.querySelector('.gtp').value,n=f.name.replace(/\.[^.]+$/,'')||'My Design';g.dataset.design=JSON.stringify({name:n,type:t,image:r.result,source:'Camera/Gallery'});document.getElementById('sel'+i).innerHTML='<div class="selected"><img src="'+r.result+'"><b>✓ '+n+'</b><br><small>Camera/Gallery • '+t+'</small></div>'};r.readAsDataURL(f)}function urlD(i){let u=document.getElementById('u'+i).value.trim();if(!u)return alert('Website link daliye.');let g=document.getElementById('g'+i),t=g.querySelector('.gtp').value;g.dataset.design=JSON.stringify({name:t+' Website Design',type:t,image:'',source:u,url:u});document.getElementById('sel'+i).innerHTML='<div class="selected"><b>✓ Website Design Saved</b><br><small>'+esc(u)+'</small></div>'}function saveOrder(e){e.preventDefault();let name=cn.value.trim(),mobile=cm.value.trim(),gs=[...document.querySelectorAll('#gb .g')].map(g=>{let d={};try{d=JSON.parse(g.dataset.design||'null')}catch(x){}return{type:g.querySelector('.gtp').value,measurements:Object.fromEntries([...g.querySelectorAll('.mi')].map(x=>[x.dataset.n,x.value.trim()]).filter(x=>x[1])),design:d}});if(!name||!mobile||!gs.length)return alert('Customer name, mobile aur garment bhariye.');let c=cs.find(x=>x.mobile===mobile);if(!c){c={name,mobile,orders:0};cs.push(c)}c.name=name;c.orders=(c.orders||0)+1;os.push({id:Date.now(),customer:name,mobile,garment:gs[0].type,garments:gs,delivery:dd.value,total:+tot.value||0,advance:+adv.value||0,created:new Date().toISOString()});save();closeM();render();alert('Customer + measurements + selected designs save ho gaye ✓')}function filterC(){let q=search.value.toLowerCase();cl.innerHTML=cs.filter(c=>(c.name+' '+c.mobile).toLowerCase().includes(q)).map(c=>'<div class="row"><b>'+esc(c.name)+'</b><span>'+esc(c.mobile)+'</span></div>').join('')||'<div class="empty">No customers</div>'}function ensure(){if(p)return;let x=document.createElement('div');x.style='position:fixed;inset:0;background:#5b4bdb;z-index:99;padding:14px;display:flex;align-items:center';x.innerHTML='<form style="background:#fff;padding:18px;border-radius:22px;width:100%;max-width:600px;margin:auto" onsubmit="profileSave(event)"><h1 style="text-align:center;color:#5b4bdb">✂️ SILAI GURU</h1><p class="muted">Profile complete karein</p><div class="form"><div class="field"><label>Name *</label><input id="pn" required></div><div class="field"><label>Mobile *</label><input id="pm" required></div><div class="field"><label>Shop *</label><input id="ps" required></div><div class="field"><label>Email *</label><input id="pe" required></div><div class="field full"><label>Address *</label><textarea id="pa" required></textarea></div><div class="field"><label>State *</label><input id="pst" required></div><div class="field"><label>City *</label><input id="pc" required></div><div class="field"><label>Pincode *</label><input id="pp" required></div></div><button class="primary">Save Profile & Open App</button></form>';document.body.appendChild(x)}function profileSave(e){e.preventDefault();p={name:pn.value,mobile:pm.value,shop:ps.value,email:pe.value,address:pa.value,state:pst.value,city:pc.value,pin:pp.value};localStorage.setItem(K,JSON.stringify(p));location.reload()}ensure();render();</script></html>
