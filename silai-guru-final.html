<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SILAI GURU</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6fb;color:#202238}
#setup{min-height:100vh;background:linear-gradient(135deg,#5b4bdb,#8067f4);padding:28px 14px;display:flex;align-items:center}
.setupCard{background:white;width:100%;max-width:620px;margin:auto;border-radius:26px;padding:22px;box-shadow:0 12px 35px #0003}
.logo{text-align:center;color:#5b4bdb;font-size:34px;font-weight:900}.sub{text-align:center;color:#73778c;margin:8px 0 22px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}
label{font-weight:700;font-size:14px}input,textarea{width:100%;padding:15px;border:1px solid #dfe1eb;border-radius:14px;font-size:17px;background:#fff}textarea{min-height:85px;resize:vertical}
#saveBtn{width:100%;margin-top:16px;padding:16px;border:0;border-radius:15px;background:#5b4bdb;color:#fff;font-size:18px;font-weight:800}
#message{text-align:center;min-height:24px;margin-top:12px;font-weight:700}
#app{display:none}.hero{background:linear-gradient(135deg,#5b4bdb,#8067f4);color:#fff;padding:20px 16px 24px;border-radius:0 0 25px 25px}.wrap{max-width:760px;margin:auto;padding:14px}.brand{font-size:28px;font-weight:900}.shop{margin-top:6px}
.box{background:#fff;border-radius:19px;padding:16px;margin:13px 0;box-shadow:0 5px 18px #20223812}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{text-align:center;background:#f0efff;border-radius:14px;padding:12px}.stat b{display:block;font-size:22px}.stat small{color:#73778c}
.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.ico{background:#fff;border:1px solid #e2e4ed;border-radius:15px;padding:11px 4px;min-height:92px;font-weight:700}.ico span{display:block;font-size:28px;margin-bottom:7px}.ico small{font-size:11px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.sheet{background:#fff;width:100%;max-width:760px;margin:auto;border-radius:25px 25px 0 0;padding:18px;max-height:88vh;overflow:auto}.close{float:right;border:0;border-radius:10px;padding:10px}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #e5e6ef}.btn{background:#5b4bdb;color:#fff;border:0;border-radius:12px;padding:13px 16px;font-weight:800}.input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin:5px 0 10px}
@media(max-width:500px){.fields{grid-template-columns:1fr}.full{grid-column:auto}.icons{gap:6px}.ico{min-height:86px}.ico span{font-size:25px}}
</style>
</head>
<body>
<section id="setup">
<div class="setupCard">
<div class="logo">✂️ SILAI GURU</div>
<div class="sub">पहली बार app use करने के लिए profile पूरा करें</div>
<div class="fields">
<div class="field"><label>User Name *</label><input id="u_name"></div>
<div class="field"><label>Mobile *</label><input id="u_mobile" inputmode="numeric"></div>
<div class="field"><label>Shop Name *</label><input id="u_shop"></div>
<div class="field"><label>Email ID *</label><input id="u_email" type="email"></div>
<div class="field full"><label>Address *</label><textarea id="u_address"></textarea></div>
<div class="field"><label>State *</label><input id="u_state"></div>
<div class="field"><label>City *</label><input id="u_city"></div>
<div class="field"><label>Pincode *</label><input id="u_pin" inputmode="numeric"></div>
</div>
<button id="saveBtn">Profile Save &amp; Open App</button>
<div id="message"></div>
</div>
</section>

<section id="app">
<header class="hero"><div class="wrap" style="padding:0"><div class="brand">✂️ SILAI GURU</div><div id="shopTop"></div><div id="ownerTop"></div></div></header>
<div class="wrap">
<div class="box"><div class="stats"><div class="stat"><b>0</b><small>Customers</small></div><div class="stat"><b>0</b><small>Orders</small></div><div class="stat"><b>₹0</b><small>Pending</small></div></div></div>
<div class="box"><h2>Dashboard</h2><div id="icons" class="icons"></div></div>
<div class="box"><h2>Quick Summary</h2><div class="row"><span>Today's Delivery</span><b>0</b></div><div class="row"><span>Pending Payment</span><b>₹0</b></div></div>
</div>
</section>
<div id="modal" class="modal"><div class="sheet"><button id="close" class="close">✕</button><h2 id="mt"></h2><div id="mb"></div></div></div>

<script>
(function(){
var KEY='silai_guru_profile_final';
var setup=document.getElementById('setup'),app=document.getElementById('app'),msg=document.getElementById('message');
var ids=['u_name','u_mobile','u_shop','u_email','u_address','u_state','u_city','u_pin'];
function get(id){return document.getElementById(id)}
function saved(p){return p && ids.every(function(id){return p[id.replace('u_','')]})}
function openApp(p){
 setup.style.display='none';app.style.display='block';
 get('shopTop').textContent=p.shop+' • '+p.city+', '+p.state;
 get('ownerTop').textContent='Owner: '+p.name;
 window.scrollTo(0,0);
}
var old=null;try{old=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
if(saved(old)){openApp(old)}

get('saveBtn').onclick=function(){
 msg.textContent='';
 var p={name:get('u_name').value.trim(),mobile:get('u_mobile').value.trim(),shop:get('u_shop').value.trim(),email:get('u_email').value.trim(),address:get('u_address').value.trim(),state:get('u_state').value.trim(),city:get('u_city').value.trim(),pin:get('u_pin').value.trim()};
 var order=['name','mobile','shop','email','address','state','city','pin'];
 for(var i=0;i<order.length;i++){
   if(!p[order[i]]){msg.style.color='#c62828';msg.textContent='⚠️ '+order[i].toUpperCase()+' detail bhariye.';return;}
 }
 try{localStorage.setItem(KEY,JSON.stringify(p));}catch(e){msg.style.color='#c62828';msg.textContent='❌ Save nahi ho raha. Browser storage blocked hai.';return;}
 var check=null;try{check=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
 if(!saved(check)){msg.style.color='#c62828';msg.textContent='❌ Profile save verify nahi hua.';return;}
 msg.style.color='#16803c';msg.textContent='✅ Profile saved. App open ho raha hai...';
 setTimeout(function(){openApp(check)},300);
};

var modules=[
['➕','New Order'],['👥','Customers'],['📋','Orders'],['📏','Measurements'],
['💰','Payments'],['🚚','Delivery'],['📊','Reports'],['🏪','Shop Profile'],
['☁️','Backup'],['🧑‍🔧','Workers'],['👗','Garments'],['⚙️','Settings'],['💎','Plans & Upgrade']
];
modules.forEach(function(x){
 var b=document.createElement('button');b.className='ico';b.innerHTML='<span>'+x[0]+'</span><small>'+x[1]+'</small>';
 b.onclick=function(){
   var p=JSON.parse(localStorage.getItem(KEY)||'{}');
   get('mt').textContent=x[1];
   get('mb').innerHTML='<p>SILAI GURU '+x[1]+' screen.</p><div class="row"><span>Shop</span><b>'+p.shop+'</b></div><div class="row"><span>Owner</span><b>'+p.name+'</b></div>';
   get('modal').style.display='flex';
 };
 get('icons').appendChild(b);
});
get('close').onclick=function(){get('modal').style.display='none'};
})();
</script>
</body></html>
