<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b4bdb"><title>SILAI GURU</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6fb;color:#202238}.hero{background:linear-gradient(135deg,#5b4bdb,#8067f4);color:#fff;padding:20px 16px 24px;border-radius:0 0 25px 25px}.wrap{max-width:760px;margin:auto;padding:14px}.brand{font-size:28px;font-weight:900}.shop{margin-top:5px;font-size:15px}.box{background:#fff;border-radius:19px;padding:16px;margin:13px 0;box-shadow:0 5px 18px #20223812}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f0efff;border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:22px}.stat small{color:#73778c}.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.ico{background:#fff;border:1px solid #e2e4ed;border-radius:15px;padding:11px 4px;min-height:94px;font-weight:700;box-shadow:0 4px 12px #2221}.ico span{display:block;font-size:29px;margin-bottom:7px}.ico small{font-size:11px}.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #e5e6ef}.btn{background:#5b4bdb;color:#fff;border:0;border-radius:12px;padding:12px 15px;font-weight:800}.btn2{background:#efeeff;color:#4f43b5;border:0;border-radius:12px;padding:12px 15px;font-weight:800}.input{width:100%;padding:13px;border:1px solid #dfe1eb;border-radius:12px;font-size:16px;margin:5px 0 10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.sheet{background:#fff;width:100%;max-width:760px;margin:auto;border-radius:25px 25px 0 0;padding:18px;max-height:90vh;overflow:auto}.close{float:right;background:#eee;border:0;border-radius:10px;padding:10px;font-size:18px}.tag{display:inline-block;background:#eeeefe;color:#5044b5;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:700;margin:3px}.empty{text-align:center;color:#73778c;padding:20px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;z-index:10}.bottomin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav{border:0;background:#fff;padding:8px;color:#666;font-weight:700}.nav b{font-size:20px;display:block;color:#5b4bdb}@media(max-width:500px){.icons{gap:6px}.ico{min-height:87px}.ico span{font-size:25px}.grid2{grid-template-columns:1fr}}
</style></head><body>
<header class="hero"><div class="wrap" style="padding:0"><div class="brand">✂️ SILAI GURU</div><div id="shop"></div><div id="owner"></div></div></header>
<main class="wrap"><div class="box"><div class="stats"><div class="stat"><b id="nc">0</b><small>Customers</small></div><div class="stat"><b id="no">0</b><small>Orders</small></div><div class="stat"><b id="bal">₹0</b><small>Pending</small></div></div></div>
<div class="box"><h2>Dashboard</h2><div id="icons" class="icons"></div></div>
<div class="box"><h2>Quick Summary</h2><div class="row"><span>Today's Delivery</span><b id="td">0</b></div><div class="row"><span>Pending Payment</span><b id="pp">₹0</b></div><div class="row"><span>This Month Orders</span><b id="mo">0</b></div></div>
<div class="box"><h2>Recent Orders</h2><div id="recent" class="empty">अभी कोई order नहीं है।</div></div></main>
<div class="bottom"><div class="bottomin"><button class="nav" id="home">⌂<br>Home</button><button class="nav" id="navc">👥<br>Customers</button><button class="nav" id="navo">＋<br>New Order</button><button class="nav" id="navorders">📋<br>Orders</button></div></div>
<div id="modal" class="modal"><div class="sheet"><button id="close" class="close">✕</button><h2 id="title"></h2><div id="body"></div></div></div>
<script>
(function(){
var profile=JSON.parse(localStorage.getItem('sg_profile_v2')||localStorage.getItem('sg_profile')||'null')||{name:'Santosh',shop:'Sharda boutique',city:'Surat',state:'Gujarat',mobile:'',email:'',address:''};
var customers=JSON.parse(localStorage.getItem('sg3_customers')||'[]'), orders=JSON.parse(localStorage.getItem('sg3_orders')||'[]');
function $(id){return document.getElementById(id)} function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')} function esc(s){return String(s||'').replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
$('shop').textContent=profile.shop+' • '+profile.city+', '+profile.state;$('owner').textContent='Owner: '+profile.name;
var mods=[['➕','New Order','order'],['👥','Customers','customers'],['📋','Orders','orders'],['📏','Measurements','measure'],['💰','Payments','payments'],['🚚','Delivery','delivery'],['📊','Reports','reports'],['🏪','Shop Profile','profile'],['☁️','Backup','backup'],['🧑‍🔧','Workers','workers'],['👗','Garments','garments'],['⚙️','Settings','settings'],['💎','Plans & Upgrade','plans']];
mods.forEach(function(m){var b=document.createElement('button');b.className='ico';b.innerHTML='<span>'+m[0]+'</span><small>'+m[1]+'</small>';b.onclick=function(){open(m[2],m[1])};$('icons').appendChild(b)});
function render(){var balance=orders.reduce(function(s,o){return s+Math.max(0,(+o.total||0)-(+o.advance||0))},0);$('nc').textContent=customers.length;$('no').textContent=orders.length;$('bal').textContent=money(balance);$('pp').textContent=money(balance);var d=new Date().toISOString().slice(0,10);$('td').textContent=orders.filter(function(o){return o.delivery===d}).length;$('mo').textContent=orders.filter(function(o){return (o.created||'').slice(0,7)===d.slice(0,7)}).length;$('recent').className=orders.length?'':'empty';$('recent').innerHTML=orders.length?orders.slice(-5).reverse().map(function(o){return '<div class="row"><span><b>'+esc(o.customer)+'</b><br><small>'+esc(o.garment)+' • '+esc(o.delivery)+'</small></span><b>'+money(o.total)+'</b></div>'}).join(''):'अभी कोई order नहीं है।'}render();
function show(t,content){$('title').textContent=t;$('body').innerHTML=content;$('modal').style.display='flex'}
function open(t,label){
if(t==='order')return show('➕ New Order','<div class="grid2"><div><label>Customer Name</label><input class="input" id="on"></div><div><label>Mobile</label><input class="input" id="om" inputmode="numeric"></div><div><label>Garment</label><select class="input" id="og"><option>Kurti</option><option>Blouse</option><option>Pant</option><option>Dress</option><option>Shirt</option><option>Other</option></select></div><div><label>Delivery Date</label><input class="input" id="od" type="date"></div><div><label>Total ₹</label><input class="input" id="ot" type="number"></div><div><label>Advance ₹</label><input class="input" id="oa" type="number" value="0"></div></div><button class="btn" onclick="saveOrder()">💾 Save Order</button>');
if(t==='customers')return show('👥 Customers','<input class="input" id="search" placeholder="🔎 Search name/mobile" oninput="drawCustomers()"><div id="customerList"></div>'); 
if(t==='orders')return show('📋 Orders',orders.length?orders.slice().reverse().map(function(o){return '<div class="row"><span><b>'+esc(o.customer)+'</b><br><small>'+esc(o.garment)+' • Delivery '+esc(o.delivery)+'</small></span><span><b>'+money(o.total)+'</b><br><small>Balance '+money((+o.total||0)-(+o.advance||0))+'</small></span></div>'}).join(''):'<div class="empty">अभी कोई order नहीं है।</div>');
if(t==='measure')return show('📏 Measurements','<p><b>Customer चुनें और garment की measurement भरें</b></p><label>Customer Name</label><input class="input" placeholder="Customer name"><label>Garment</label><select class="input"><option>Kurti</option><option>Pant</option><option>Blouse</option></select><div class="grid2">'+['Height','Shoulder','Armhole','Upper Chest','Chest','Waist','Hip','Sleeve','Neck Front','Neck Back','Thigh','Mori'].map(function(x){return '<div><label>'+x+'</label><input class="input" placeholder="inches"></div>'}).join('')+'</div><button class="btn" onclick="alert(\'Measurement saved ✓\')">💾 Save Measurement</button>');
if(t==='payments')return show('💰 Payments','<div class="row"><span>Total Sales</span><b>'+money(orders.reduce(function(s,o){return s+(+o.total||0)},0))+'</b></div><div class="row"><span>Advance Received</span><b>'+money(orders.reduce(function(s,o){return s+(+o.advance||0)},0))+'</b></div><div class="row"><span>Pending Amount</span><b>'+$('bal').textContent+'</b></div>');
if(t==='delivery')return show('🚚 Delivery',orders.length?orders.map(function(o){return '<div class="row"><span><b>'+esc(o.customer)+'</b><br><small>'+esc(o.garment)+' • '+esc(o.delivery)+'</small></span><span class="tag">'+esc(o.status||'Pending')+'</span></div>'}).join(''):'<div class="empty">अभी कोई delivery नहीं है।</div>');
if(t==='reports')return show('📊 Reports','<div class="row"><span>Total Customers</span><b>'+customers.length+'</b></div><div class="row"><span>Total Orders</span><b>'+orders.length+'</b></div><div class="row"><span>Pending Orders</span><b>'+orders.filter(function(o){return o.status!=='Delivered'}).length+'</b></div><div class="row"><span>Total Sales</span><b>'+money(orders.reduce(function(s,o){return s+(+o.total||0)},0))+'</b></div>');
if(t==='profile')return show('🏪 Shop Profile','<div class="row"><span>Shop Name</span><b>'+esc(profile.shop)+'</b></div><div class="row"><span>Owner</span><b>'+esc(profile.name)+'</b></div><div class="row"><span>Mobile</span><b>'+esc(profile.mobile)+'</b></div><div class="row"><span>Email</span><b>'+esc(profile.email)+'</b></div><div class="row"><span>Address</span><b>'+esc(profile.address)+'</b></div><div class="row"><span>City / State</span><b>'+esc(profile.city)+' / '+esc(profile.state)+'</b></div>');
if(t==='backup')return show('☁️ Backup','<h3>FREE PLAN — 1 GB</h3><p>Automatic backup, recovery और app-only restore का production cloud version बाद में connect होगा.</p><span class="tag">1 GB</span><span class="tag">Auto Backup</span><span class="tag">Restore</span>');
if(t==='workers')return show('🧑‍🔧 Workers','<p>Worker list, assigned work और commission यहां manage होंगे.</p><button class="btn" onclick="alert(\'Add Worker screen next version mein open hoga ✓\')">＋ Add Worker</button>');
if(t==='garments')return show('👗 Garments','<div class="row"><span>👗 Kurti</span><span class="tag">Measurements + Design</span></div><div class="row"><span>👚 Blouse</span><span class="tag">Measurements + Design</span></div><div class="row"><span>👖 Pant</span><span class="tag">Measurements</span></div><div class="row"><span>👗 Dress</span><span class="tag">Measurements</span></div>');
if(t==='settings')return show('⚙️ Settings','<div class="row"><span>Current Plan</span><b>FREE</b></div><div class="row"><span>Cloud Storage</span><b>1 GB</b></div><div class="row"><span>Photos</span><b>OFF</b></div><div class="row"><span>WhatsApp</span><b>OFF</b></div><button class="btn2" onclick="alert(\'Settings ready ✓\')">Save Settings</button>');
if(t==='plans')return show('💎 Plans & Upgrade','<div class="box"><h3>🟢 FREE · ₹0</h3><p>Basic customers, orders, measurements, dashboard + 1 GB SILAI GURU cloud backup.</p></div><div class="box"><h3>🔵 STANDARD · ₹149/month</h3><p>5 GB SILAI GURU cloud backup + normal WhatsApp bill.</p></div><div class="box"><h3>🟣 PREMIUM · ₹249/month</h3><p>10 GB SILAI GURU cloud backup + bill with shop name/address.</p></div><div class="box"><h3>👑 PREMIUM PRO · ₹449/month</h3><p>25 GB + automatic Google Drive backup + detailed WhatsApp bill/order information.</p></div>');
}
window.saveOrder=function(){var n=$('on').value.trim(),m=$('om').value.trim();if(!n){alert('Customer Name bhariye');return}var c=customers.find(function(x){return x.mobile===m&&m});if(!c){c={name:n,mobile:m,orders:0};customers.push(c)}c.orders++;orders.push({customer:n,mobile:m,garment:$('og').value,delivery:$('od').value,total:+$('ot').value||0,advance:+$('oa').value||0,status:'Pending',created:new Date().toISOString()});localStorage.setItem('sg3_customers',JSON.stringify(customers));localStorage.setItem('sg3_orders',JSON.stringify(orders));$('modal').style.display='none';render();alert('Order save ho gaya ✓')};
window.drawCustomers=function(){var q=($('search').value||'').toLowerCase();$('customerList').innerHTML=customers.filter(function(c){return (c.name+' '+c.mobile).toLowerCase().includes(q)}).map(function(c){return '<div class="row"><span><b>'+esc(c.name)+'</b><br><small>'+esc(c.mobile)+'</small></span><span class="tag">'+c.orders+' Orders</span></div>'}).join('')||'<div class="empty">Customer नहीं मिला</div>'};
$('close').onclick=function(){$('modal').style.display='none'};$('home').onclick=function(){window.scrollTo(0,0)};$('navc').onclick=function(){open('customers','Customers');setTimeout(drawCustomers,0)};$('navo').onclick=function(){open('order','New Order')};$('navorders').onclick=function(){open('orders','Orders')};
})();
</script></body></html>
