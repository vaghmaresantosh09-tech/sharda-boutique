<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SILAI GURU</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(160deg,#5541dc,#765bea);min-height:100vh;padding:34px 18px;color:#20213a}.card{max-width:760px;margin:auto;background:#fff;border-radius:30px;padding:28px;box-shadow:0 18px 50px #0002}.logo{text-align:center;color:#5541dc;font-size:34px;font-weight:800;margin:10px 0}.sub{text-align:center;color:#74778d;font-size:19px;margin:0 0 25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{font-weight:700;font-size:16px;display:block}input,textarea{width:100%;margin-top:7px;border:1px solid #dddff0;border-radius:16px;padding:15px;font-size:16px;outline:none;background:#fff}textarea{min-height:90px;resize:vertical}.full{grid-column:1/-1}button{width:100%;margin-top:22px;border:0;border-radius:17px;padding:17px;background:#5541dc;color:#fff;font-size:19px;font-weight:800}button:active{transform:scale(.99)}@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:22px 18px}.logo{font-size:31px}}</style></head><body><div class="card"><div class="logo">✂️ SILAI GURU</div><p class="sub">पहली बार app use करने के लिए profile पूरा करें</p>
<form action="silai-guru-dashboard-v4.html" method="get">
<div class="grid">
<div><label>User Name *</label><input name="user" required autocomplete="name"></div>
<div><label>Mobile *</label><input name="mobile" required inputmode="numeric" autocomplete="tel"></div>
<div><label>Shop Name *</label><input name="shop" required autocomplete="organization"></div>
<div><label>Email ID *</label><input name="email" required type="email" autocomplete="email"></div>
<div class="full"><label>Address *</label><textarea name="address" required autocomplete="street-address"></textarea></div>
<div><label>State *</label><input name="state" required autocomplete="address-level1"></div>
<div><label>City *</label><input name="city" required autocomplete="address-level2"></div>
<div><label>Pincode *</label><input name="pincode" required inputmode="numeric" autocomplete="postal-code"></div>
</div><button type="submit">Profile Save &amp; Open App</button></form></div></body></html>
