<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SILAI GURU Setup</title><style>body{margin:0;background:linear-gradient(160deg,#5541dc,#765bea);font-family:Arial;padding:30px 18px}.card{max-width:760px;margin:auto;background:#fff;border-radius:28px;padding:25px}h1{text-align:center;color:#5541dc}p{text-align:center;color:#777}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-weight:700}input,textarea{width:100%;padding:14px;margin-top:6px;border:1px solid #ddd;border-radius:14px;box-sizing:border-box;font-size:16px}.full{grid-column:1/-1}button{width:100%;padding:17px;border:0;border-radius:15px;background:#5541dc;color:#fff;font-size:18px;font-weight:700;margin-top:20px}@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="card"><h1>✂️ SILAI GURU</h1><p>पहली बार app use करने के लिए profile पूरा करें</p><form action="silai-guru-dashboard-v5.html" method="get"><div class="grid"><div><label>User Name *</label><input name="user" required></div><div><label>Mobile *</label><input name="mobile" required></div><div><label>Shop Name *</label><input name="shop" required></div><div><label>Email ID *</label><input name="email" type="email" required></div><div class="full"><label>Address *</label><textarea name="address" required></textarea></div><div><label>State *</label><input name="state" required></div><div><label>City *</label><input name="city" required></div><div><label>Pincode *</label><input name="pincode" required></div></div><button>Profile Save & Open App</button></form></div></body></html>
