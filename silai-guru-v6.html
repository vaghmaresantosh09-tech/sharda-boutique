<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SILAI GURU</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f5fb;color:#20213a}.setup{min-height:100vh;background:linear-gradient(160deg,#5541dc,#765bea);padding:35px 18px}.card{max-width:760px;margin:auto;background:#fff;border-radius:28px;padding:25px}.card h1{text-align:center;color:#5541dc}.card p{text-align:center;color:#777}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-weight:700;display:block;margin-bottom:5px}input,textarea,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:13px;font-size:16px}.full{grid-column:1/-1}.btn{width:100%;padding:16px;border:0;border-radius:14px;background:#5541dc;color:#fff;font-size:18px;font-weight:700;margin-top:18px}.dash{display:none}.top{background:linear-gradient(135deg,#5541dc,#7358eb);color:#fff;padding:25px 18px 35px;border-radius:0 0 30px 30px}.brand{font-size:28px;font-weight:800}.shop{font-size:19px;font-weight:800;margin-top:18px}.meta{margin-top:5px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:-18px 14px 20px}.stat{background:#fff;border-radius:18px;padding:15px;text-align:center}.stat b{display:block;color:#5541dc;font-size:23px}.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 14px}.icon{border:0;background:#fff;border-radius:18px;min-height:92px;font-size:28px;box-shadow:0 4px 15px #0001}.icon span{display:block;font-size:12px;font-weight:700;margin-top:7px}.profile{background:#fff;margin:22px 14px;padding:20px;border-radius:20px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:9;align-items:flex-end}.modal.on{display:flex}.sheet{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px}.close{float:right;border:0;border-radius:50%;width:40px;height:40px;font-size:24px}.item{background:#f7f7fb;border-radius:14px;padding:13px;margin:9px 0}.field{margin:10px 0}.action{width:100%;padding:13px;border:0;border-radius:13px;background:#5541dc;color:#fff;font-weight:700;margin-top:7px}@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.icons{grid-template-columns:repeat(4,1fr)}} </style></head><body>
<section class="setup" id="setup"><div class="card"><h1>✂️ SILAI GURU</h1><p>पहली बार app use करने के लिए profile पूरा करें</p><div class="grid"><div><label>User Name *</label><input id="u"></div><div><label>Mobile *</label><input id="m" inputmode="numeric"></div><div><label>Shop Name *</label><input id="s"></div><div><label>Email ID *</label><input id="e" type="email"></div><div class="full"><label>Address *</label><textarea id="a"></textarea></div><div><label>State *</label><input id="st"></div><div><label>City *</label><input id="c"></div><div><label>Pincode *</label><input id="p" inputmode="numeric"></div></div><button class="btn" id="saveProfile">Profile Save & Open App</button></div></section>
<section class="dash" id="dash"><header class="top"><div class="brand">✂️ SILAI GURU</div><div class="shop" id="shop"></div><div class="meta" id="owner"></div></header><div class="stats"><div class="stat"><b id="cc">0</b>Customers</div><div class="stat"><b id="oc">0</b>Orders</div><div class="stat"><b id="pa">₹0</b>Pending</div></div><div class="icons" id="icons"></div><div class="profile"><h2>Profile Saved ✅</h2><div id="pv"></div></div></section>
<div class="modal" id="modal"><div class="sheet"><button class="close" id="close">×</button><div id="content"></div></div></div>
<script>
const K='sg_v6_profile',O='sg_v6_orders';const $=id=>document.getElementById(id);let orders=JSON.parse(localStorage.getItem(O)||'[]');
const names=['New Order','Customers','Orders','Measurements','Payments','Delivery','Reports','Shop Profile','Backup','Workers','Garments','Settings','Plans & Upgrade'],ics=['🧾','👥','📦','📏','💰','🚚','📊','🏪','☁️','👷','👗','⚙️','💎'];
function profile(){try{return JSON.parse(localStorage.getItem(K)||'null')}catch(e){return null}}
function showDash(p){$('setup').style.display='none';$('dash').style.display='block';$('shop').textContent=p.shop+' • '+p.city+', '+p.state;$('owner').textContent='Owner: '+p.user;$('pv').innerHTML='<b>User:</b> '+p.user+'<br><b>Mobile:</b> '+p.mobile+'<br><b>Email:</b> '+p.email+'<br><b>Address:</b> '+p.address+'<br><b>Pincode:</b> '+p.pincode;stats()}
function stats(){let ms={};let pen=0;orders.forEach(x=>{ms[x.mobile]=1;pen+=(+x.total||0)- (+x.advance||0)});$('cc').textContent=Object.keys(ms).length;$('oc').textContent=orders.length;$('pa').textContent='₹'+pen}
function measures(type){let f=type==='Pant'?['Height','Hip','Thigh','Mori']:type==='Blouse'?['Height','Shoulder','Armhole','Upper Chest','Chest','Waist','Neck Front','Neck Back','Sleeve']:['Height','Shoulder','Armhole','Upper Chest','Chest','Waist','Hip','Neck Front','Neck Back','Sleeve'];return f.map(x=>'<div class="field"><label>'+x+'</label><input data-m="'+x+'"></div>').join('')}
function addG(){let d=document.createElement('div');d.className='item garment';d.innerHTML='<b>Garment</b><div class="field"><label>Garment Type</label><select>'+['Kurti','Blouse','Pant','Dress','Shirt','Other'].map(x=>'<option>'+x+'</option>').join('')+'</select></div><div class="meas">'+measures('Kurti')+'</div><button class="action rm">− Remove Garment</button>';$('gb').appendChild(d);d.querySelector('select').onchange=e=>d.querySelector('.meas').innerHTML=measures(e.target.value);d.querySelector('.rm').onclick=()=>d.remove()}
function open(n){let h='<h2>'+names[n]+'</h2>';if(n===0){h+='<p>Ek customer ke saath multiple garments add karein. Har garment ke niche measurements.</p><div class="field"><label>Customer Name *</label><input id="cn"></div><div class="field"><label>Mobile *</label><input id="cm"></div><div id="gb"></div><button class="action" id="ag">＋ Add Another Garment</button><div class="field"><label>Delivery Date</label><input id="dd" type="date"></div><div class="field"><label>Total Amount</label><input id="tt" type="number"></div><div class="field"><label>Advance</label><input id="av" type="number"></div><button class="action" id="sv">Save Customer & Order</button>'}else if(n===1){h+=orders.length?orders.map(x=>'<div class="item"><b>'+x.name+'</b><br>📱 '+x.mobile+'<br>'+x.garments.map(g=>'👗 '+g.name).join('<br>')+'<button class="action">＋ Add Garment</button></div>').join(''):'<p>No customers yet.</p>'}else if(n===2){h+=orders.length?orders.map((x,i)=>'<div class="item"><b>Order '+(i+1)+' — '+x.name+'</b><br>'+x.garments.map(g=>'👗 '+g.name).join(' • ')+'<br>Delivery: '+(x.delivery||'Not set')+'<br>Total ₹'+x.total+' • Advance ₹'+x.advance+' • Balance ₹'+((+x.total||0)-(+x.advance||0))+'</div>').join(''):'<p>No orders yet.</p>'}else if(n===3)h+='<p>Garment-wise measurement screen</p>'+measures('Kurti');else if(n===4)h+='<div class="item">Sales ₹'+orders.reduce((s,x)=>s+(+x.total||0),0)+'</div><div class="item">Pending ₹'+$('pa').textContent.replace('₹','')+'</div>';else if(n===5)h+='<p>Delivery list</p>'+orders.map(x=>'<div class="item">🚚 '+x.name+' — '+(x.delivery||'Not set')+'</div>').join('');else if(n===6)h+='<div class="item">Customers: '+$('cc').textContent+'</div><div class="item">Orders: '+orders.length+'</div><div class="item">Pending: '+$('pa').textContent+'</div>';else if(n===7)h+='<div class="item">'+$('pv').innerHTML+'</div>';else if(n===8)h+='<div class="item">☁️ Backup section — Free plan 1 GB concept</div>';else if(n===9)h+='<div class="field"><label>Worker Name</label><input></div><button class="action">Save Worker</button>';else if(n===10)h+='<div class="item">👗 Kurti</div><div class="item">👚 Blouse</div><div class="item">👖 Pant</div>';else if(n===11)h+='<div class="item">🔔 Delivery reminder settings</div>';else h+='<div class="item"><b>🟢 FREE ₹0</b><br>1 GB backup</div><div class="item"><b>🔵 STANDARD ₹149/month</b><br>5 GB cloud</div><div class="item"><b>🟣 PREMIUM ₹249/month</b><br>10 GB cloud</div><div class="item"><b>👑 PREMIUM PRO ₹449/month</b><br>25 GB + Google Drive</div>';$('content').innerHTML=h;$('modal').className='modal on';if(n===0){addG();$('ag').onclick=addG;$('sv').onclick=save}}
function save(){let gs=[...document.querySelectorAll('.garment')].map(d=>{let ms={};d.querySelectorAll('[data-m]').forEach(x=>ms[x.dataset.m]=x.value);return{name:d.querySelector('select').value,measurements:ms}}),name=$('cn').value.trim(),mobile=$('cm').value.trim();if(!name||!mobile||!gs.length){alert('Customer Name, Mobile aur kam se kam 1 garment bhariye');return}orders.push({name,mobile,garments:gs,delivery:$('dd').value,total:$('tt').value||0,advance:$('av').value||0});localStorage.setItem(O,JSON.stringify(orders));stats();$('modal').className='modal';alert('Customer & Order saved ✅')}
$('saveProfile').onclick=function(){let p={user:$('u').value.trim(),mobile:$('m').value.trim(),shop:$('s').value.trim(),email:$('e').value.trim(),address:$('a').value.trim(),state:$('st').value.trim(),city:$('c').value.trim(),pincode:$('p').value.trim()};if(Object.values(p).some(v=>!v)){alert('Sabhi * fields bhariye');return}localStorage.setItem(K,JSON.stringify(p));showDash(p)};
$('icons').innerHTML=names.map((n,i)=>'<button class="icon" data-i="'+i+'">'+ics[i]+'<span>'+n+'</span></button>').join('');document.querySelectorAll('.icon').forEach(b=>b.onclick=()=>open(+b.dataset.i));$('close').onclick=()=>{$('modal').className='modal'};
let p=profile();if(p)showDash(p);
</script></body></html>
