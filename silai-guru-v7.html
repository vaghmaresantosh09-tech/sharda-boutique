<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SILAI GURU — Profile Setup</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#5541dc,#8a63ee);min-height:100vh;padding:22px;color:#20213a}
.card{max-width:720px;margin:auto;background:#fff;border-radius:28px;padding:24px;box-shadow:0 15px 45px #0003}
.logo{text-align:center;font-size:30px;font-weight:900;color:#5541dc}.sub{text-align:center;color:#777;margin:7px 0 22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}label{font-weight:700;display:block;margin:0 0 6px}
input,textarea{width:100%;padding:14px;border:1px solid #ddd;border-radius:13px;font-size:16px}textarea{min-height:90px;resize:vertical}
button{width:100%;border:0;border-radius:14px;padding:16px;background:#5541dc;color:white;font-size:18px;font-weight:800;margin-top:18px}
.note{background:#f4f1ff;padding:12px;border-radius:13px;margin-top:16px;font-size:13px;color:#514a78}
@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body><main class="card">
<div class="logo">✂️ SILAI GURU</div>
<div class="sub">पहली बार app use करने के लिए profile पूरा करें</div>
<form action="silai-guru-dashboard-v7.html" method="get">
<div class="grid">
<div><label>User Name *</label><input name="user" required></div>
<div><label>Mobile Number *</label><input name="mobile" inputmode="numeric" required></div>
<div><label>Shop Name *</label><input name="shop" required></div>
<div><label>Email ID *</label><input name="email" type="email" required></div>
<div class="full"><label>Address *</label><textarea name="address" required></textarea></div>
<div><label>State *</label><input name="state" value="Gujarat" required></div>
<div><label>City *</label><input name="city" value="Surat" required></div>
<div><label>Pincode *</label><input name="pincode" inputmode="numeric" required></div>
</div>
<button type="submit">Profile Save & Open App ➜</button>
</form>
<div class="note">Profile submit browser ke normal form navigation se Dashboard kholega — JavaScript par depend nahi karta.</div>
</main></body></html>
