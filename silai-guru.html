function esc(x){return String(x||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function money(x){return'₹'+Number(x||0).toLocaleString('en-IN')}function save(){localStorage.setItem(CK,JSON.stringify(cs));localStorage.setItem(OK,JSON.stringify(os))}
function el(id){return document.getElementById(id)}function render(){if(!p)return;el('topshop').textContent=(p.shop||'My Shop')+' • '+(p.city||'')+', '+(p.state||'');el('topowner').textContent='Owner: '+(p.name||'')+' • Plan: '+PLAN_INFO[plan].name;el('nc').textContent=cs.length;el('no').textContent=os.length;const balance=os.reduce((s,o)=>s+Math.max(0,Number(o.total||0)-Number(o.advance||0)),0);el('nb').textContent=money(balance);const t=new Date().toISOString().slice(0,10),m=t.slice(0,7);el('td').textContent=os.filter(o=>o.delivery===t).length;el('ppay').textContent=money(balance);el('mo').textContent=os.filter(o=>(o.created||'').slice(0,7)===m).length;el('ad').textContent=plan==='free'?'ADVERTISEMENT · FREE PLAN':plan==='standard'?'ADVERTISEMENT · ADVANCE (1×/DAY)':'✓ '+PLAN_INFO[plan].name+' · AD-FREE';el('recent').innerHTML=os.slice(-5).reverse().map(o=>'<div class="row"><span><b>'+esc(o.customer)+'</b><br><small>'+esc(o.garment)+' • '+esc(o.delivery)+'</small></span><b>'+money(o.total)+'</b></div>').join('')||'<div class="empty">अभी कोई order नहीं है।</div>'}

const PLAN_INFO={
free:{name:'FREE',price:'₹0',storage:'1 GB',devices:1,photos:'OFF',wa:'OFF',ads:'Banner + App-open'},
standard:{name:'ADVANCE',price:'₹149/month',storage:'5 GB',devices:2,photos:'Up to 10',wa:'Normal WhatsApp Bill',ads:'App-open once/day'},

function setPlan(x){if(!PLAN_INFO[x])return;plan=x;localStorage.setItem(PK,x);closeM();render();alert('Test Plan ON: '+PLAN_INFO[x].name+' ✓\\nPayment नहीं लगेगा.');}

function planGate(required){
const rank={free:0,standard:1,premium:2,pro:3};

return true;
}
function openM(t){modal.classList.add('modal','show');if(t==='garments'){if(!planGate('premium'))return;openGarmentLibrary();return}const title={order:'➕ New Order',customers:'👥 Customers',orders:'📋 Orders',measure:'📏 Measurements',payments:'💰 Payments',delivery:'🚚 Delivery',reports:'📊 Reports',profile:'🏪 Shop Profile',backup:'☁️ Backup',workers:'🧑‍🔧 Workers',garments:'👗 Garments',settings:'⚙️ Settings',plans:'💎 Plans & Upgrade'}[t]||t;mt.textContent=title;mb.innerHTML=content(t)}

function loadExtra(){try{return JSON.parse(localStorage.getItem(DK)||'[]')}catch(e){return []}}
function saveExtra(a){localStorage.setItem(DK,JSON.stringify(a))}
function applyTheme(name){
  const themes={
    default:{bg:'#f6f7fb',card:'#fff',p:'#5b4bdb',p2:'#8267f5',text:'#202238'},
    blue:{bg:'#eef6ff',card:'#fff',p:'#1976d2',p2:'#42a5f5',text:'#172033'},
    green:{bg:'#effaf3',card:'#fff',p:'#198754',p2:'#42b883',text:'#183027'},
    rose:{bg:'#fff3f6',card:'#fff',p:'#c13c70',p2:'#e8799e',text:'#30202a'},
    dark:{bg:'#171923',card:'#222534',p:'#6f63e8',p2:'#9b8cff',text:'#f4f4f7'}

  const t=themes[name]||themes.default,root=document.documentElement;

  localStorage.setItem(TK,name||'default');

function saveProfileSettings(){
  const v=id=>String(document.getElementById(id)?.value||'').trim();
  const next={name:v('spn'),mobile:v('spm'),shop:v('sps'),email:v('spe'),address:v('spa'),state:v('spst'),city:v('spc'),pin:v('spp')};
  if(!next.name||!next.mobile||!next.shop||!next.email){alert('Name, Mobile, Shop Name aur Email zaroor bhariye.');return}
  p=next;localStorage.setItem(K,JSON.stringify(p));render();alert('User details save ho gayi ✓');openM('settings');
}
function addExtraDetail(){
  const label=prompt('Nayi detail ka naam (jaise GST No., Tailor Name, Note):');
  if(!label||!label.trim())return;
  const val=prompt(label.trim()+' ki value:')||'';
  const a=loadExtra();a.push({id:Date.now(),label:label.trim(),value:val.trim()});saveExtra(a);openM('settings');
}
function removeExtraDetail(id){
  const a=loadExtra().filter(x=>x.id!==id);saveExtra(a);openM('settings');
}
function editExtraDetail(id){
  const a=loadExtra(),x=a.find(y=>y.id===id);if(!x)return;
  const label=prompt('Detail ka naam:',x.label),value=prompt('Detail ki value:',x.value);

}

function garmentDesignsFor(type){

}
function openGarmentLibrary(){

function openDesignCatalog(type){
  if(!planGate('premium'))return;
  const designs=garmentDesignsFor(type);
  const saved=loadSavedDesigns();
  const chips=['All Designs'].concat(designs.slice(0,5).map(x=>x.name));
  mt.textContent='👗 '+type+' Designs';
  mb.innerHTML='<div class="design-back"><button class="secondary" onclick="openGarmentLibrary()">← Garments</button><b>'+type+' · '+designs.length+' Designs</b></div><input class="design-search" id="designSearch" placeholder="🔎 Search '+type+' design..." oninput="filterDesigns(\''+esc(type).replace(/'/g,"\\'")+'\')"><div class="design-toolbar">'+chips.map((x,i)=>'<button class="design-chip '+(i===0?'active':'')+'">'+esc(x)+'</button>').join('')+'</div><div id="designGrid" class="design-grid">'+designs.map(d=>designCardHtml(d,saved)).join('')+'</div><div class="library-note">💡 Design ko Save karke My Garment Folder me rakhein.</div>';

function designCardHtml(d,saved){
  const isSaved=saved.some(x=>x.id===d.id);
  return '<div class="design-card"><div class="design-img">'+d.svg+'</div><div class="design-name">'+esc(d.name)+'</div><div class="design-actions"><button class="secondary" onclick="toggleSavedDesign(\''+d.id+'\',\''+esc(d.type).replace(/'/g,"\\'")+'\',\''+esc(d.name).replace(/'/g,"\\'")+'\')">'+(isSaved?'✓ Saved':'☆ Save')+'</button><button class="primary" onclick="showDesignToCustomer(\''+esc(d.type).replace(/'/g,"\\'")+'\',\''+esc(d.name).replace(/'/g,"\\'")+'\')">👁 Show</button></div></div>';
}
function filterDesigns(type){
  const q=String(el('designSearch')?.value||'').toLowerCase();
  const saved=loadSavedDesigns();
  const designs=garmentDesignsFor(type).filter(d=>d.name.toLowerCase().includes(q));
  const grid=el('designGrid');if(grid)grid.innerHTML=designs.map(d=>designCardHtml(d,saved)).join('')||'<div class="design-empty">Design nahi mila.</div>';
}
function toggleSavedDesign(id,type,name){
  const a=loadSavedDesigns(),i=a.findIndex(x=>x.id===id);
  if(i>=0)a.splice(i,1);else a.push({id,type,name,savedAt:Date.now()});
  saveSavedDesigns(a);openDesignCatalog(type);
}
function openGarmentFolder(){
  if(!planGate('premium'))return;

}

    'Other':svg('<circle cx="50" cy="48" r="28" fill="#eee" stroke="#666" stroke-width="2"/><path d="M33 58l15-25 7 7-15 25zM53 34l5-5 9 9-5 5zM61 54l6 6-5 5-6-6z" fill="#ef5b55" stroke="#8c2f2b" stroke-width="2"/><path d="M39 66l-7 7" stroke="#666" stroke-width="3"/>','#ef5b55')
  };
  return map[type]||map['Other'];
}
function garmentCard(i,type){
  const fields=garmentFields(type);
  const garmentTypes=[['Blouse'],['Salwar Suit'],['Kurta'],['Shirt'],['Pant'],['Saree Blouse'],['Kurti'],['Salwar'],['Kameez'],['Lehenga'],['Choli'],['Gown'],['Dress'],['Blazer'],['Waistcoat'],['Sherwani'],['Pajama'],['Suit'],['School Uniform'],['Other']];
  const proPhoto=plan==='pro';
  return '<div class="garment-card" id="garment-'+i+'"><div class="garment-head"><div class="garment-title">👗 Garment '+(i+1)+'</div><button type="button" class="remove-g" onclick="removeGarment('+i+')">− Remove Garment</button></div><div class="field"><label>Garment Type</label><div class="'+(proPhoto?'photo-garment-grid':'free-garment-list')+'">'+garmentTypes.map((x,idx)=>'<label class="'+(proPhoto?'photo-g-option':'free-g-option')+'">'+(proPhoto?'<span class="gpic">'+garmentVisual(x[0])+'</span>':'')+'<b>'+x[0]+'</b><input type="radio" name="garmentType'+i+'" value="'+x[0]+'" '+((type===x[0]||(idx===0&&!type))?'checked':'')+' onchange="refreshGarmentFields('+i+')"></label>').join('')+'</div></div><div class="measure-grid g-fields">'+fields.map(n=>'<div class="field"><label>'+n+'</label><input class="g-measure" data-name="'+n+'" placeholder="inches"></div>').join('')+'</div></div>';
}
function refreshGarmentFields(i){const card=document.getElementById('garment-'+i);if(!card)return;const radio=card.querySelector('input[name="garmentType'+i+'"]:checked');const type=radio?radio.value:card.querySelector('.g-type')?.value||'Kurti';const old=Object.fromEntries(Array.from(card.querySelectorAll('.g-measure')).map(x=>[x.dataset.name,x.value]));card.querySelector('.g-fields').innerHTML=garmentFields(type).map(n=>'<div class="field"><label>'+n+'</label><input class="g-measure" data-name="'+n+'" placeholder="inches" value="'+esc(old[n]||'')+'"></div>').join('')}
function initGarments(){const w=document.getElementById('garmentsWrap');if(w&&!w.children.length)w.innerHTML=garmentCard(0,'Kurti')}
function addGarment(){const w=document.getElementById('garmentsWrap');if(!w)return;const i=w.children.length;w.insertAdjacentHTML('beforeend',garmentCard(i,'Kurti'))}
function removeGarment(i){const w=document.getElementById('garmentsWrap'),card=document.getElementById('garment-'+i);if(w&&card&&w.children.length>1)card.remove()}
function collectGarments(){return Array.from(document.querySelectorAll('#garmentsWrap .garment-card')).map(card=>{const radio=card.querySelector('input[name^="garmentType"]:checked');const type=radio?radio.value:card.querySelector('.g-type')?.value||'Kurti';return {type,measurements:Object.fromEntries(Array.from(card.querySelectorAll('.g-measure')).map(x=>[x.dataset.name,x.value.trim()]).filter(x=>x[1]))};})}
function addO(e){e.preventDefault();const name=document.getElementById('cn').value.trim(),mob=document.getElementById('cm').value.trim(),c=cs.find(x=>x.mobile===mob),garments=collectGarments();if(!name||!mob||!garments.length){alert('Customer name, mobile aur kam se kam ek garment zaroor bhariye.');return false}let customer=c;if(!customer){customer={id:Date.now(),name,mobile:mob,orders:0};cs.push(customer)}customer.orders++;os.push({id:Date.now(),customer:name,mobile:mob,garment:garments[0].type,garments,workDate:document.getElementById('cwd').value,delivery:document.getElementById('cd').value,total:+document.getElementById('ct').value||0,advance:+document.getElementById('ca').value||0,note:document.getElementById('co').value,status:'Pending',created:new Date().toISOString()});save();closeM();render();alert('Customer & Order save ho gaya ✓');return false}
function statusO(id){let o=os.find(x=>x.id===id);o.status=o.status==='Pending'?'Ready':'Delivered';save();render();openM('delivery')}function saveProfile(){try{const v=id=>{const e=document.getElementById(id);return e?String(e.value||'').trim():''};const fields=['pn','pm','ps','pe','pa','pst','pc','pp'];for(const id of fields){if(!v(id)){alert('Kripya sabhi * wali details bhariye.');const e=document.getElementById(id);if(e)e.focus();return false;}}p={name:v('pn'),mobile:v('pm'),shop:v('ps'),email:v('pe'),address:v('pa'),state:v('pst'),city:v('pc'),pin:v('pp')};localStorage.setItem(K,JSON.stringify(p));const check=JSON.parse(localStorage.getItem(K)||'null');if(!check||check.mobile!==p.mobile){alert('Profile save nahi hua.');return false;}cs=JSON.parse(localStorage.getItem(CK)||'[]');os=JSON.parse(localStorage.getItem(OK)||'[]');document.getElementById('onboard').hidden=true;document.getElementById('onboard').style.display='none';render();window.scrollTo(0,0);return false;}catch(err){console.error(err);alert('App open karne mein error aaya. Kripya page refresh karke dobara try karein.');return false;}}try{p=JSON.parse(localStorage.getItem(K)||'null');plan=localStorage.getItem(PK)||'free';applyTheme(localStorage.getItem(TK)||'default')}catch(e){p=null;plan='free'}const o=document.getElementById('onboard');if(p&&p.name&&p.mobile&&p.shop&&p.email&&p.address&&p.state&&p.city&&p.pin){o.hidden=true;o.style.display='none';}else{o.hidden=false;o.style.display='flex';}render();
</script></body></html>
