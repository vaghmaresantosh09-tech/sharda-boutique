<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b4bdb"><title>SILAI GURU</title><style>
:root{--p:#5b4bdb;--p2:#8267f5;--bg:#f6f7fb;--card:#fff;--text:#202238;--muted:#73778c;--line:#e5e6ef}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;font-weight:700}.app{max-width:760px;margin:auto;padding-bottom:80px}.hero{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:20px 16px 24px;border-radius:0 0 25px 25px}.brand{font-size:26px;font-weight:900}.shop{margin-top:5px;font-size:14px}.wrap{padding:14px}.card{background:#fff;border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 5px 18px #2022380c}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f0efff;border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:21px}.stat small{color:var(--muted)}.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.ico{background:#fff;border:1px solid var(--line);padding:11px 4px;min-height:90px;box-shadow:0 4px 12px #2221}.ico i{display:block;font-style:normal;font-size:28px;margin-bottom:6px}.ico small{font-weight:700;font-size:11px}.banner{background:#fff1cf;color:#765500;padding:13px;text-align:center;border-radius:13px;font-size:12px;font-weight:700}.row{display:flex;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}.muted{color:var(--muted);font-size:12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:20}.bottomin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav{background:none;color:var(--muted);text-align:center;padding:8px}.nav b{display:block;font-size:21px;color:var(--p)}.modal,.onboard{position:fixed;inset:0;background:#0007;z-index:50;display:none;align-items:flex-end}.onboard{display:flex;background:linear-gradient(135deg,#5b4bdb,#8267f5);align-items:center;padding:14px}.sheet,.oncard{background:#fff;width:100%;max-width:760px;margin:auto;border-radius:24px 24px 0 0;padding:18px;max-height:92vh;overflow:auto}.oncard{border-radius:25px;max-width:620px}.onboard[hidden]{display:none!important}.modal.show{display:flex}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}label{font-size:12px;font-weight:700}input,select,textarea{padding:11px;border:1px solid var(--line);border-radius:11px;width:100%;background:#fff}.primary{background:var(--p);color:#fff;width:100%;margin-top:10px}.secondary{background:#efeeff;color:#4f43b5}.close{float:right;background:#eee}.pill{display:inline-block;padding:4px 8px;background:#eeeefe;color:#5044b5;border-radius:99px;font-size:11px;font-weight:700}.empty{text-align:center;color:var(--muted);padding:20px}@media(max-width:500px){.form{grid-template-columns:1fr}.full{grid-column:auto}.icons{gap:7px}.ico{min-height:84px}}</style></head><body>
<div id="onboard" class="onboard"><div class="oncard"><h1 style="text-align:center;color:#5b4bdb">✂️ SILAI GURU</h1><p style="text-align:center;color:#73778c">पहली बार app use करने के लिए profile पूरा करें</p><form id="pf" novalidate><div class="form"><div class="field"><label>User Name *</label><input id="pn" required></div><div class="field"><label>Mobile *</label><input id="pm" required inputmode="numeric"></div><div class="field"><label>Shop Name *</label><input id="ps" required></div><div class="field"><label>Email ID *</label><input id="pe" required type="email"></div><div class="field full"><label>Address *</label><textarea id="pa" required></textarea></div><div class="field"><label>State *</label><input id="pst" required></div><div class="field"><label>City *</label><input id="pc" required></div><div class="field"><label>Pincode *</label><input id="pp" required inputmode="numeric"></div></div><button type="button" class="primary" onclick="saveProfile()">Profile Save & Open App</button></form></div></div>
<div class="app"><header class="hero"><div class="brand">✂️ SILAI GURU</div><div class="shop" id="topshop"></div><div id="topowner" style="font-size:12px;opacity:.85"></div></header><div class="wrap">
<div class="card"><div class="stats"><div class="stat"><b id="nc">0</b><small>Customers</small></div><div class="stat"><b id="no">0</b><small>Orders</small></div><div class="stat"><b id="nb">₹0</b><small>Pending</small></div></div></div>
<div id="ad" class="banner"></div>
<div class="card"><h2>Dashboard</h2><div class="icons" id="icons"></div></div>
<div class="card"><h2>Quick Summary</h2><div class="row"><span>Today's Delivery</span><b id="td">0</b></div><div class="row"><span>Pending Payment</span><b id="ppay">₹0</b></div><div class="row"><span>This Month Orders</span><b id="mo">0</b></div></div>
<div class="card"><h2>Recent Orders</h2><div id="recent"></div></div>
</div></div>
<div class="bottom"><div class="bottomin"><button class="nav" onclick="closeM()">⌂<br>Home</button><button class="nav" onclick="openM('customers')">👥<br>Customers</button><button class="nav" onclick="openM('order')">＋<br>New Order</button><button class="nav" onclick="openM('orders')">📋<br>Orders</button></div></div>
<div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeM()">✕</button><h2 id="mt"></h2><div id="mb"></div></div></div>
<script>
const K='sg_profile',CK='sg_customers',OK='sg_orders',PK='sg_plan';let p=JSON.parse(localStorage.getItem(K)||'null'),cs=JSON.parse(localStorage.getItem(CK)||'[]'),os=JSON.parse(localStorage.getItem(OK)||'[]'),plan=localStorage.getItem(PK)||'free';
const mods=[['➕','New Order','order'],['👥','Customers','customers'],['📋','Orders','orders'],['📏','Measurements','measure'],['💰','Payments','payments'],['🚚','Delivery','delivery'],['📊','Reports','reports'],['🏪','Shop Profile','profile'],['☁️','Backup','backup'],['🧑‍🔧','Workers','workers'],['👗','Garments','garments'],['⚙️','Settings','settings'],['💎','Plans & Upgrade','plans']];
function esc(x){return String(x||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function money(x){return'₹'+Number(x||0).toLocaleString('en-IN')}function save(){localStorage.setItem(CK,JSON.stringify(cs));localStorage.setItem(OK,JSON.stringify(os))}
function el(id){return document.getElementById(id)}function render(){if(!p)return;el('topshop').textContent=(p.shop||'My Shop')+' • '+(p.city||'')+', '+(p.state||'');el('topowner').textContent='Owner: '+(p.name||'')+' • Plan: '+PLAN_INFO[plan].name;el('nc').textContent=cs.length;el('no').textContent=os.length;const balance=os.reduce((s,o)=>s+Math.max(0,Number(o.total||0)-Number(o.advance||0)),0);el('nb').textContent=money(balance);const t=new Date().toISOString().slice(0,10),m=t.slice(0,7);el('td').textContent=os.filter(o=>o.delivery===t).length;el('ppay').textContent=money(balance);el('mo').textContent=os.filter(o=>(o.created||'').slice(0,7)===m).length;el('ad').textContent=plan==='free'?'ADVERTISEMENT · FREE PLAN':plan==='standard'?'ADVERTISEMENT · ADVANCE (1×/DAY)':'✓ '+PLAN_INFO[plan].name+' · AD-FREE';el('recent').innerHTML=os.slice(-5).reverse().map(o=>'<div class="row"><span><b>'+esc(o.customer)+'</b><br><small>'+esc(o.garment)+' • '+esc(o.delivery)+'</small></span><b>'+money(o.total)+'</b></div>').join('')||'<div class="empty">अभी कोई order नहीं है।</div>'}
icons.innerHTML=mods.map((x,i)=>'<button class="ico" onclick="openM(\''+x[2]+'\')"><i>'+x[0]+'</i><small>'+x[1]+'</small></button>').join('');
const PLAN_INFO={
free:{name:'FREE',price:'₹0',storage:'1 GB',devices:1,photos:'OFF',wa:'OFF',ads:'Banner + App-open'},
standard:{name:'ADVANCE',price:'₹149/month',storage:'5 GB',devices:2,photos:'Up to 10',wa:'Normal WhatsApp Bill',ads:'App-open once/day'},
premium:{name:'PREMIUM',price:'₹249/month',storage:'10 GB',devices:5,photos:'Up to 50',wa:'Bill + Shop Name + Address',ads:'Ad-free'},
pro:{name:'PREMIUM PRO',price:'₹449/month',storage:'25 GB',devices:10,photos:'Unlimited',wa:'Bill + Delivery + Shop/Owner Details',ads:'Ad-free'}
};
function setPlan(x){if(!PLAN_INFO[x])return;plan=x;localStorage.setItem(PK,x);closeM();render();alert('Test Plan ON: '+PLAN_INFO[x].name+' ✓\\nPayment नहीं लगेगा.');}
function resetPlan(){setPlan('free');}
function planGate(required){
const rank={free:0,standard:1,premium:2,pro:3};
if(rank[plan] < rank[required]){alert('यह feature '+PLAN_INFO[required].name+' plan में available है.\\nअभी Test Paid Plan से activate करें.');openM('plans');return false}
return true;
}
function openM(t){modal.classList.add('modal','show');const title={order:'➕ New Order',customers:'👥 Customers',orders:'📋 Orders',measure:'📏 Measurements',payments:'💰 Payments',delivery:'🚚 Delivery',reports:'📊 Reports',profile:'🏪 Shop Profile',backup:'☁️ Backup',workers:'🧑‍🔧 Workers',garments:'👗 Garments',settings:'⚙️ Settings',plans:'💎 Plans & Upgrade'}[t]||t;mt.textContent=title;mb.innerHTML=content(t)}
function closeM(){modal.classList.remove('show')}
function content(t){if(t==='order')return '<form onsubmit="addO(event)"><div class="form"><div class="field"><label>Customer Name *</label><input id="cn" required></div><div class="field"><label>Mobile</label><input id="cm"></div><div class="field"><label>Garment</label><select id="cg"><option>Kurti</option><option>Blouse</option><option>Pant</option><option>Dress</option><option>Shirt</option><option>Other</option></select></div><div class="field"><label>Delivery Date *</label><input id="cd" type="date" required></div><div class="field"><label>Total ₹</label><input id="ct" type="number"></div><div class="field"><label>Advance ₹</label><input id="ca" type="number" value="0"></div><div class="field full"><label>Notes</label><textarea id="co"></textarea></div></div><button class="primary">💾 Save Order</button></form>';
if(t==='customers')return '<input id="search" placeholder="🔎 Search name/mobile" oninput="filterC()"><div id="cl">'+crow(cs)+'</div><button class="primary" onclick="openM(\'order\')">＋ Add New Customer / Order</button>';
if(t==='orders')return os.length?os.slice().reverse().map(o=>'<div class="row"><span><b>'+esc(o.customer)+'</b><br><small>'+esc(o.garment)+' • Delivery '+esc(o.delivery)+'</small></span><span><b>'+money(o.total)+'</b><br><small>Balance '+money(o.total-o.advance)+'</small></span></div>').join(''):'<div class="empty">No orders</div>';
if(t==='measure')return '<div class="row"><b>Kurti</b><span class="pill">Height • Shoulder • Chest • Waist • Hip • Sleeve</span></div><div class="row"><b>Blouse</b><span class="pill">Height • Shoulder • Chest • Waist • Neck • Sleeve</span></div><div class="row"><b>Pant</b><span class="pill">Height • Hip • Thigh • Mori</span></div><h3>Measurement Form</h3><div class="form">'+['Height','Shoulder','Armhole','Upper Chest','Chest','Waist','Hip','Neck Front','Neck Back','Sleeve','Thigh','Mori'].map(x=>'<div class="field"><label>'+x+'</label><input placeholder="inches"></div>').join('')+'</div><button class="primary" onclick="alert(\'Measurement saved ✓\')">Save Measurement</button>';
if(t==='payments')return '<div class="row"><span>Total</span><b>'+money(os.reduce((s,o)=>s+o.total,0))+'</b></div><div class="row"><span>Advance</span><b>'+money(os.reduce((s,o)=>s+o.advance,0))+'</b></div><div class="row"><span>Pending</span><b>'+nb.textContent+'</b></div>';
if(t==='delivery')return os.length?os.map(o=>'<div class="row"><span><b>'+esc(o.customer)+'</b><br><small>'+esc(o.garment)+' • '+esc(o.delivery)+'</small></span><button class="secondary" onclick="statusO('+o.id+')">'+esc(o.status||'Pending')+'</button></div>').join(''):'<div class="empty">No delivery</div>';
if(t==='reports')return '<div class="row"><span>Customers</span><b>'+cs.length+'</b></div><div class="row"><span>Orders</span><b>'+os.length+'</b></div><div class="row"><span>Pending</span><b>'+os.filter(o=>o.status!=='Delivered').length+'</b></div><div class="row"><span>Sales</span><b>'+money(os.reduce((s,o)=>s+o.total,0))+'</b></div>';
if(t==='profile')return '<div class="row"><span>Shop</span><b>'+esc(p.shop)+'</b></div><div class="row"><span>Owner</span><b>'+esc(p.name)+'</b></div><div class="row"><span>Mobile</span><b>'+esc(p.mobile)+'</b></div><div class="row"><span>Address</span><b>'+esc(p.address)+'</b></div><div class="row"><span>Plan</span><b>FREE</b></div>';
if(t==='backup')return '<p><b>'+PLAN_INFO[plan].name+' — '+PLAN_INFO[plan].storage+'</b></p><p class="muted">इस test में backup local demo है. Real encrypted SILAI GURU cloud, same-number recovery और production authentication backend में connect होगा.</p><button class="secondary" onclick="alert(\'Backup Test ✓\')">☁️ Auto Backup Test</button>';
if(t==='workers'){if(!planGate('standard'))return '<div class="empty">Paid feature</div>';return '<p>Worker profiles, assignment और commission management.</p><button class="primary" onclick="alert(\'Worker module ready for next data screen\')">＋ Add Worker</button>'};
if(t==='garments')return '<div class="row"><span>👗 Kurti</span><span class="pill">Available</span></div><div class="row"><span>👗 Blouse</span><span class="pill">Available</span></div><div class="row"><span>👖 Pant</span><span class="pill">Available</span></div><div class="row"><span>👗 Dress</span><span class="pill">Available</span></div>';
if(t==='plans')return '<div class="banner" style="margin-bottom:12px">🧪 TEST PAID PLAN — बिना payment</div><p class="muted">नीचे कोई भी plan चुनें. यह सिर्फ testing के लिए है; असली subscription/payment अभी connect नहीं है.</p><div class="card" style="border:2px solid #ddd7ff"><h3>🟢 FREE · ₹0</h3><div class="row"><span>Storage</span><b>1 GB</b></div><div class="row"><span>Devices</span><b>1</b></div><div class="row"><span>Photos / WhatsApp</span><b>OFF / OFF</b></div><button class="secondary" onclick="setPlan(\'free\')">✓ Use FREE Test</button></div><div class="card" style="border:2px solid #dbeafe"><h3>🔵 ADVANCE · ₹149/month</h3><div class="row"><span>Storage / Devices</span><b>5 GB / 2</b></div><div class="row"><span>Photos</span><b>Up to 10</b></div><div class="row"><span>WhatsApp</span><b>Normal Bill</b></div><button class="primary" onclick="setPlan(\'standard\')">🧪 Test ADVANCE</button></div><div class="card" style="border:2px solid #eadcff"><h3>🟣 PREMIUM · ₹249/month</h3><div class="row"><span>Storage / Devices</span><b>10 GB / 5</b></div><div class="row"><span>Photos</span><b>Up to 50</b></div><div class="row"><span>Billing</span><b>Colour PDF / Print</b></div><button class="primary" onclick="setPlan(\'premium\')">🧪 Test PREMIUM</button></div><div class="card" style="border:2px solid #ffe1a8"><h3>👑 PREMIUM PRO · ₹449/month</h3><div class="row"><span>Storage / Devices</span><b>25 GB / 10</b></div><div class="row"><span>Photos</span><b>Unlimited</b></div><div class="row"><span>Google Drive</span><b>Automatic</b></div><div class="row"><span>WhatsApp</span><b>Professional Bill</b></div><button class="primary" onclick="setPlan(\'pro\')">🧪 Test PREMIUM PRO</button></div><button class="secondary" style="width:100%;margin-top:4px" onclick="resetPlan()">↩ Reset to FREE</button>';if(t==='settings')return '<div class="row"><span>Current Plan</span><b>'+PLAN_INFO[plan].name+'</b></div><div class="row"><span>Price</span><b>'+PLAN_INFO[plan].price+'</b></div><div class="row"><span>Devices</span><b>'+PLAN_INFO[plan].devices+'</b></div><div class="row"><span>Cloud Storage</span><b>'+PLAN_INFO[plan].storage+'</b></div><div class="row"><span>Photos</span><b>'+PLAN_INFO[plan].photos+'</b></div><div class="row"><span>WhatsApp</span><b>'+PLAN_INFO[plan].wa+'</b></div><div class="row"><span>Ads</span><b>'+PLAN_INFO[plan].ads+'</b></div><button class="primary" onclick="openM(\'plans\')">💎 Change / Test Plan</button><button class="secondary" style="width:100%;margin-top:8px" onclick="localStorage.clear();location.reload()">Reset Demo</button>';}function crow(a){return a.length?a.map(c=>'<div class="row"><span><b>'+esc(c.name)+'</b><br><small>📞 '+esc(c.mobile)+' • '+c.orders+' order(s)</small></span><button class="secondary" onclick="customerHistory(\''+esc(c.mobile)+'\')">History</button></div>').join(''):'<div class="empty">No customers</div>'}function customerHistory(m){const c=cs.find(x=>x.mobile===m),list=os.filter(x=>x.mobile===m);mt.textContent='👤 '+(c?.name||'Customer History');mb.innerHTML='<p><b>Mobile:</b> '+esc(m)+'</p>'+(list.length?list.map(o=>'<div class="row"><span>'+esc(o.garment)+'<br><small>Delivery '+esc(o.delivery)+' • '+(o.status||'Pending')+'</small></span><b>'+money(o.total)+'</b></div>').join(''):'<div class="empty">No orders yet</div>')}function filterC(){cl.innerHTML=crow(cs.filter(c=>(c.name+' '+c.mobile).toLowerCase().includes(search.value.toLowerCase())))}function addO(e){e.preventDefault();let name=cn.value.trim(),mob=cm.value.trim(),c=cs.find(x=>x.mobile===mob);if(!c){c={id:Date.now(),name,mobile:mob,orders:0};cs.push(c)}c.orders++;os.push({id:Date.now(),customer:name,mobile:mob,garment:cg.value,delivery:cd.value,total:+ct.value||0,advance:+ca.value||0,note:co.value,status:'Pending',created:new Date().toISOString()});save();closeM();render();alert('Order save ho gaya ✓')}function statusO(id){let o=os.find(x=>x.id===id);o.status=o.status==='Pending'?'Ready':'Delivered';save();render();openM('delivery')}function saveProfile(){try{const v=id=>{const e=document.getElementById(id);return e?String(e.value||'').trim():''};const fields=['pn','pm','ps','pe','pa','pst','pc','pp'];for(const id of fields){if(!v(id)){alert('Kripya sabhi * wali details bhariye.');const e=document.getElementById(id);if(e)e.focus();return false;}}p={name:v('pn'),mobile:v('pm'),shop:v('ps'),email:v('pe'),address:v('pa'),state:v('pst'),city:v('pc'),pin:v('pp')};localStorage.setItem(K,JSON.stringify(p));const check=JSON.parse(localStorage.getItem(K)||'null');if(!check||check.mobile!==p.mobile){alert('Profile save nahi hua.');return false;}cs=JSON.parse(localStorage.getItem(CK)||'[]');os=JSON.parse(localStorage.getItem(OK)||'[]');document.getElementById('onboard').hidden=true;document.getElementById('onboard').style.display='none';render();window.scrollTo(0,0);return false;}catch(err){console.error(err);alert('App open karne mein error aaya. Kripya page refresh karke dobara try karein.');return false;}}try{p=JSON.parse(localStorage.getItem(K)||'null');plan=localStorage.getItem(PK)||'free'}catch(e){p=null;plan='free'}const o=document.getElementById('onboard');if(p&&p.name&&p.mobile&&p.shop&&p.email&&p.address&&p.state&&p.city&&p.pin){o.hidden=true;o.style.display='none';}else{o.hidden=false;o.style.display='flex';}render();
</script></body></html>
