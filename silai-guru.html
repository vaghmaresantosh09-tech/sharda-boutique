<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b4bdb"><title>SILAI GURU</title><style>
:root{--p:#5b4bdb;--p2:#8267f5;--bg:#f6f7fb;--card:#fff;--text:#202238;--muted:#73778c;--line:#e5e6ef}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;font-weight:700}.app{max-width:760px;margin:auto;padding-bottom:80px}.hero{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:20px 16px 24px;border-radius:0 0 25px 25px}.brand{font-size:26px;font-weight:900}.shop{margin-top:5px;font-size:14px}.wrap{padding:14px}.card{background:#fff;border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 5px 18px #2022380c}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f0efff;border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:21px}.stat small{color:var(--muted)}.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.ico{background:#fff;border:1px solid var(--line);padding:11px 4px;min-height:90px;box-shadow:0 4px 12px #2221}.ico i{display:block;font-style:normal;font-size:28px;margin-bottom:6px}.ico small{font-weight:700;font-size:11px}.banner{background:#fff1cf;color:#765500;padding:13px;text-align:center;border-radius:13px;font-size:12px;font-weight:700}.row{display:flex;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}.muted{color:var(--muted);font-size:12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:20}.bottomin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav{background:none;color:var(--muted);text-align:center;padding:8px}.nav b{display:block;font-size:21px;color:var(--p)}.modal,.onboard{position:fixed;inset:0;background:#0007;z-index:50;display:none;align-items:flex-end}.onboard{display:flex;background:linear-gradient(135deg,#5b4bdb,#8267f5);align-items:center;padding:14px}.sheet,.oncard{background:#fff;width:100%;max-width:760px;margin:auto;border-radius:24px 24px 0 0;padding:18px;max-height:92vh;overflow:auto}.oncard{border-radius:25px;max-width:620px}.modal.show{display:flex}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}label{font-size:12px;font-weight:700}input,select,textarea{padding:11px;border:1px solid var(--line);border-radius:11px;width:100%;background:#fff}.primary{background:var(--p);color:#fff;width:100%;margin-top:10px}.secondary{background:#efeeff;color:#4f43b5}.close{float:right;background:#eee}.pill{display:inline-block;padding:4px 8px;background:#eeeefe;color:#5044b5;border-radius:99px;font-size:11px;font-weight:700}.empty{text-align:center;color:var(--muted);padding:20px}@media(max-width:500px){.form{grid-template-columns:1fr}.full{grid-column:auto}.icons{gap:7px}.ico{min-height:84px}}</style></head><body>
<div id="onboard" class="onboard"><div class="oncard"><h1 style="text-align:center;color:#5b4bdb">✂️ SILAI GURU</h1><p style="text-align:center;color:#73778c">पहली बार app use करने के लिए profile पूरा करें</p><form id="pf"><div class="form"><div class="field"><label>User Name *</label><input id="pn" required></div><div class="field"><label>Mobile *</label><input id="pm" required inputmode="numeric"></div><div class="field"><label>Shop Name *</label><input id="ps" required></div><div class="field"><label>Email ID *</label><input id="pe" required type="email"></div><div class="field full"><label>Address *</label><textarea id="pa" required></textarea></div><div class="field"><label>State *</label><input id="pst" required></div><div class="field"><label>City *</label><input id="pc" required></div><div class="field"><label>Pincode *</label><input id="pp" required inputmode="numeric"></div></div><button class="primary">Profile Save & Open App</button></form></div></div>
<div class="app"><header class="hero"><div class="brand">✂️ SILAI GURU</div><div class="shop" id="topshop"></div><div id="topowner" style="font-size:12px;opacity:.85"></div></header><div class="wrap">
<div class="card"><div class="stats"><div class="stat"><b id="nc">0</b><small>Customers</small></div><div class="stat"><b id="no">0</b><small>Orders</small></div><div class="stat"><b id="nb">₹0</b><small>Pending</small></div></div></div>
<div id="ad" class="banner">ADVERTISEMENT · FREE PLAN</div>
<div class="card"><h2>Dashboard</h2><div class="icons" id="icons"></div></div>
<div class="card"><h2>Quick Summary</h2><div class="row"><span>Today's Delivery</span><b id="td">0</b></div><div class="row"><span>Pending Payment</span><b id="ppay">₹0</b></div><div class="row"><span>This Month Orders</span><b id="mo">0</b></div></div>
<div class="card"><h2>Recent Orders</h2><div id="recent"></div></div>
</div></div>
<div class="bottom"><div class="bottomin"><button class="nav" onclick="closeM()">⌂<br>Home</button><button class="nav" onclick="openM('customers')">👥<br>Customers</button><button class="nav" onclick="openM('order')">＋<br>New Order</button><button class="nav" onclick="openM('orders')">📋<br>Orders</button></div></div>
<div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeM()">✕</button><h2 id="mt"></h2><div id="mb"></div></div></div>
<script>
const K='sg_profile',CK='sg_customers',OK='sg_orders';let p=JSON.parse(localStorage.getItem(K)||'null'),cs=JSON.parse(localStorage.getItem(CK)||'[]'),os=JSON.parse(localStorage.getItem(OK)||'[]');
const mods=[['➕','New Order','order'],['👥','Customers','customers'],['📋','Orders','orders'],['📏','Measurements','measure'],['💰','Payments','payments'],['🚚','Delivery','delivery'],['📊','Reports','reports'],['🏪','Shop Profile','profile'],['☁️','Backup','backup'],['🧑‍🔧','Workers','workers'],['👗','Garments','garments'],['⚙️','Settings','settings'],['💎','Plans & Upgrade','plans']];
function esc(x){return String(x||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function money(x){return'₹'+Number(x||0).toLocaleString('en-IN')}function save(){localStorage.setItem(CK,JSON.stringify(cs));localStorage.setItem(OK,JSON.stringify(os))}
function render(){if(!p)return;topshop.textContent=p.shop+' • '+p.city+', '+p.state;topowner.textContent='Owner: '+p.name;nc.textContent=cs.length;no.textContent=os.length;nb.textContent=money(os.reduce((s,o)=>s+Math.max(0,o.total-o.advance),0));let t=new Date().toISOString().slice(0,10),m=t.slice(0,7);td.textContent=os.filter(o=>o.delivery===t).length;ppay.textContent=nb.textContent;mo.textContent=os.filter(o=>(o.created||'').slice(0,7)===m).length;recent.innerHTML=os.slice(-5).reverse().map(o=>'<div class="row"><span><b>'+esc(o.customer)+'</b><br><small>'+esc(o.garment)+' • '+esc(o.delivery)+'</small></span><b>'+money(o.total)+'</b></div>').join('')||'<div class="empty">अभी कोई order नहीं है।</div>'}
icons.innerHTML=mods.map((x,i)=>'<button class="ico" onclick="openM(\''+x[2]+'\')"><i>'+x[0]+'</i><small>'+x[1]+'</small></button>').join('');
function openM(t){modal.classList.add('modal','show');const title={order:'➕ New Order',customers:'👥 Customers',orders:'📋 Orders',measure:'📏 Measurements',payments:'💰 Payments',delivery:'🚚 Delivery',reports:'📊 Reports',profile:'🏪 Shop Profile',backup:'☁️ Backup',workers:'🧑‍🔧 Workers',garments:'👗 Garments',settings:'⚙️ Settings',plans:'💎 Plans & Upgrade'}[t]||t;mt.textContent=title;mb.innerHTML=content(t)}
function closeM(){modal.classList.remove('show')}
function content(t){if(t==='order')return '<form onsubmit="addO(event)"><div class="form"><div class="field"><label>Customer Name *</label><input id="cn" required></div><div class="field"><label>Mobile</label><input id="cm"></div><div class="field"><label>Garment</label><select id="cg"><option>Kurti</option><option>Blouse</option><option>Pant</option><option>Dress</option><option>Shirt</option><option>Other</option></select></div><div class="field"><label>Delivery Date *</label><input id="cd" type="date" required></div><div class="field"><label>Total ₹</label><input id="ct" type="number"></div><div class="field"><label>Advance ₹</label><input id="ca" type="number" value="0"></div><div class="field full"><label>Notes</label><textarea id="co"></textarea></div></div><button class="primary">💾 Save Order</button></form>';
if(t==='customers')return '<input id="search" placeholder="🔎 Search name/mobile" oninput="filterC()"><div id="cl">'+crow(cs)+'</div>';
if(t==='orders')return os.length?os.slice().reverse().map(o=>'<div class="row"><span><b>'+esc(o.customer)+'</b><br><small>'+esc(o.garment)+' • Delivery '+esc(o.delivery)+'</small></span><span><b>'+money(o.total)+'</b><br><small>Balance '+money(o.total-o.advance)+'</small></span></div>').join(''):'<div class="empty">No orders</div>';
if(t==='measure')return '<p>Basic garment measurements</p><div class="form">'+['Height','Shoulder','Armhole','Chest','Waist','Hip','Sleeve','Neck Front/Back','Thigh','Mori'].map(x=>'<div class="field"><label>'+x+'</label><input placeholder="inches"></div>').join('')+'</div><button class="primary" onclick="alert(\'Measurement saved ✓\')">Save Measurement</button>';
if(t==='payments')return '<div class="row"><span>Total</span><b>'+money(os.reduce((s,o)=>s+o.total,0))+'</b></div><div class="row"><span>Advance</span><b>'+money(os.reduce((s,o)=>s+o.advance,0))+'</b></div><div class="row"><span>Pending</span><b>'+nb.textContent+'</b></div>';
if(t==='delivery')return os.length?os.map(o=>'<div class="row"><span><b>'+esc(o.customer)+'</b><br><small>'+esc(o.garment)+' • '+esc(o.delivery)+'</small></span><button class="secondary" onclick="statusO('+o.id+')">'+esc(o.status||'Pending')+'</button></div>').join(''):'<div class="empty">No delivery</div>';
if(t==='reports')return '<div class="row"><span>Customers</span><b>'+cs.length+'</b></div><div class="row"><span>Orders</span><b>'+os.length+'</b></div><div class="row"><span>Pending</span><b>'+os.filter(o=>o.status!=='Delivered').length+'</b></div><div class="row"><span>Sales</span><b>'+money(os.reduce((s,o)=>s+o.total,0))+'</b></div>';
if(t==='profile')return '<div class="row"><span>Shop</span><b>'+esc(p.shop)+'</b></div><div class="row"><span>Owner</span><b>'+esc(p.name)+'</b></div><div class="row"><span>Mobile</span><b>'+esc(p.mobile)+'</b></div><div class="row"><span>Address</span><b>'+esc(p.address)+'</b></div><div class="row"><span>Plan</span><b>FREE</b></div>';
if(t==='backup')return '<p><b>Free Plan — 1 GB</b></p><p class="muted">इस test में backup local demo है. Real encrypted SILAI GURU cloud, same-number recovery और production authentication backend में connect होगा.</p><button class="secondary" onclick="alert(\'Backup Test ✓\')">☁️ Auto Backup Test</button>';
if(t==='workers')return '<p>Worker profiles, assignment और commission management.</p><button class="primary" onclick="alert(\'Worker module ready for next data screen\')">＋ Add Worker</button>';
if(t==='garments')return '<div class="row"><span>👗 Kurti</span><span class="pill">Available</span></div><div class="row"><span>👗 Blouse</span><span class="pill">Available</span></div><div class="row"><span>👖 Pant</span><span class="pill">Available</span></div><div class="row"><span>👗 Dress</span><span class="pill">Available</span></div>';
if(t==='plans')return '<div class="banner" style="margin-bottom:12px">SILAI GURU Subscription Plans</div><div class="card" style="border:2px solid #ddd7ff"><h3>🟢 FREE · ₹0</h3><div class="muted">Basic customers, orders, measurements & dashboard</div><div class="row"><span>Cloud Backup</span><b>1 GB</b></div><div class="row"><span>WhatsApp / Photos</span><b>Not included</b></div></div><div class="card" style="border:2px solid #dbeafe"><h3>🔵 STANDARD · ₹149/month</h3><div class="muted">5 GB SILAI GURU cloud backup</div><div class="row"><span>Backup</span><b>5 GB</b></div><div class="row"><span>Restore</span><b>SILAI GURU app</b></div><div class="row"><span>Bill Sharing</span><b>Normal WhatsApp Bill</b></div></div><div class="card" style="border:2px solid #eadcff"><h3>🟣 PREMIUM · ₹249/month</h3><div class="muted">10 GB SILAI GURU cloud backup</div><div class="row"><span>Backup</span><b>10 GB</b></div><div class="row"><span>Restore</span><b>SILAI GURU app</b></div><div class="row"><span>Bill Sharing</span><b>Bill + Shop Name + Address</b></div></div><div class="card" style="border:2px solid #ffe1a8"><h3>👑 PREMIUM PRO · ₹449/month</h3><div class="muted">25 GB + automatic Google Drive backup</div><div class="row"><span>Backup</span><b>25 GB</b></div><div class="row"><span>Google Drive</span><b>Automatic</b></div><div class="row"><span>WhatsApp</span><b>Bill + Delivery + Shop/Owner Details</b></div><div class="row"><span>Restore</span><b>SILAI GURU app</b></div></div><button class="primary" onclick="alert('Upgrade flow production version mein payment gateway ke saath connect hoga.')">⬆️ Upgrade Plan</button>';if(t==='settings')return '<div class="row"><span>Plan</span><b>FREE</b></div><div class="row"><span>Photos</span><b>OFF</b></div><div class="row"><span>WhatsApp</span><b>OFF</b></div><div class="row"><span>Ads</span><b>Banner + App-open</b></div><button class="primary" onclick="localStorage.clear();location.reload()">Reset Demo</button>'}
function crow(a){return a.length?a.map(c=>'<div class="row"><span><b>'+esc(c.name)+'</b><br><small>'+esc(c.mobile)+' • '+c.orders+' order(s)</small></span></div>').join(''):'<div class="empty">No customers</div>'}function filterC(){cl.innerHTML=crow(cs.filter(c=>(c.name+' '+c.mobile).toLowerCase().includes(search.value.toLowerCase())))}function addO(e){e.preventDefault();let name=cn.value.trim(),mob=cm.value.trim(),c=cs.find(x=>x.mobile===mob);if(!c){c={id:Date.now(),name,mobile:mob,orders:0};cs.push(c)}c.orders++;os.push({id:Date.now(),customer:name,mobile:mob,garment:cg.value,delivery:cd.value,total:+ct.value||0,advance:+ca.value||0,note:co.value,status:'Pending',created:new Date().toISOString()});save();closeM();render();alert('Order save ho gaya ✓')}function statusO(id){let o=os.find(x=>x.id===id);o.status=o.status==='Pending'?'Ready':'Delivered';save();render();openM('delivery')}document.getElementById('pf').addEventListener('submit',function(e){e.preventDefault();const v=id=>document.getElementById(id).value.trim();p={name:v('pn'),mobile:v('pm'),shop:v('ps'),email:v('pe'),address:v('pa'),state:v('pst'),city:v('pc'),pin:v('pp')};localStorage.setItem(K,JSON.stringify(p));document.getElementById('onboard').style.display='none';render();alert('SILAI GURU profile ready ✓');});if(p){document.getElementById('onboard').style.display='none';}render();
</script></body></html>
