<div id="onboard" class="onboard"><div class="oncard"><h1 style="text-align:center;color:#5b4bdb">✂️ SILAI GURU</h1><p style="text-align:center;color:#73778c">पहली बार app use करने के लिए profile पूरा करें</p><form id="pf" novalidate><div class="form"><div class="field"><label>User Name *</label><input id="pn" required></div><div class="field"><label>Mobile *</label><input id="pm" required inputmode="numeric"></div><div class="field"><label>Shop Name *</label><input id="ps" required></div><div class="field"><label>Email ID *</label><input id="pe" required type="email"></div><div class="field full"><label>Address *</label><textarea id="pa" required></textarea></div><div class="field"><label>State *</label><input id="pst" required></div><div class="field"><label>City *</label><input id="pc" required></div><div class="field"><label>Pincode *</label><input id="pp" required inputmode="numeric"></div></div><button type="button" id="profileSaveBtn" class="primary">Profile Save & Open App</button></form></div></div>

<script>
const K='sg_profile',CK='sg_customers',OK='sg_orders',PK='sg_plan',TK='sg_theme',DK='sg_profile_extra';let p=JSON.parse(localStorage.getItem(K)||'null'),cs=JSON.parse(localStorage.getItem(CK)||'[]'),os=JSON.parse(localStorage.getItem(OK)||'[]'),plan=localStorage.getItem(PK)||'free';let orderDesignTargets={};let orderFormSnapshot=null;
const mods=[['New Order','order'],['Customers','customers'],['Orders','orders'],['Measurements','measure'],['Payments','payments'],['Delivery','delivery'],['Reports','reports'],['Shop Profile','profile'],['Backup','backup'],['Workers','workers'],['Garments','garments'],['Design Library','designs'],['Settings','settings'],['Plans & Upgrade','plans']];
function dashboardIcon(t){
 const s='stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"';
 const F=b=>'<svg viewBox="0 0 64 64" aria-hidden="true">'+b+'</svg>';
 const shapes={
  'New Order':`<rect x="14" y="9" width="36" height="46" rx="6" fill="#eef0ff" ${s}/><path d="M23 20h18M23 29h18M23 38h9" ${s}/><path d="M40 37l7 7-12 7-3-9z" fill="#6b5ce7" ${s}/>`,
  'Customers':`<circle cx="25" cy="23" r="9" fill="#dceeff" ${s}/><circle cx="43" cy="25" r="7" fill="#eee9ff" ${s}/><path d="M10 51c1-10 7-15 15-15s14 5 15 15M36 39c7-4 16 1 18 12" fill="#e8f4ff" ${s}/>`,
  'Orders':`<rect x="14" y="8" width="36" height="48" rx="6" fill="#fff4d6" ${s}/><path d="M24 8v7h16V8M22 25h20M22 34h15M22 43h11" ${s}/><circle cx="46" cy="45" r="7" fill="#6b5ce7" ${s}/><path d="m43 45 2 2 4-5" stroke="#fff" ${s}/>`,
  'Measurements':`<path d="M18 52 51 19 45 13 12 46z" fill="#e6f5ff" ${s}/><path d="m22 48 4 4M28 42l4 4M34 36l4 4M40 30l4 4M17 17h12M17 24h8M17 31h12" ${s}/>`,
  'Payments':`<circle cx="32" cy="32" r="22" fill="#fff2cf" ${s}/><path d="M21 25h22v15H21z" fill="#ffe39a" ${s}/><path d="M27 33h10M32 29v8M35 30c-1-2-6-2-6 1 0 3 7 1 7 5 0 3-5 4-7 1" ${s}/>`,
  'Delivery':`<path d="M8 18h31v25H8z" fill="#e8f4ff" ${s}/><path d="M39 27h10l7 8v8H39z" fill="#eee9ff" ${s}/><circle cx="20" cy="47" r="6" fill="#fff" ${s}/><circle cx="48" cy="47" r="6" fill="#fff" ${s}/><path d="M45 27v8h10" ${s}/>`,
  'Reports':`<path d="M12 52V12M12 52h43" ${s}/><rect x="20" y="34" width="7" height="18" rx="2" fill="#bfe4ff"/><rect x="31" y="25" width="7" height="27" rx="2" fill="#d9d1ff"/><rect x="42" y="17" width="7" height="35" rx="2" fill="#ffd98e"/><path d="m20 29 9-8 8 4 10-12" fill="none" ${s}/>`,
  'Shop Profile':`<path d="M10 25 15 12h34l5 13" fill="#eee9ff" ${s}/><path d="M12 25h40v29H12z" fill="#f8f7ff" ${s}/><path d="M19 54V38h12v16M39 35h7M39 42h7" ${s}/><path d="M12 25c0 5 9 6 12 0 2 6 12 6 14 0 3 6 12 5 14 0" fill="#dceeff" ${s}/>`,
  'Backup':`<path d="M19 46h28c7 0 10-5 8-10-1-4-5-7-9-7-2-8-14-12-21-5-7-1-13 4-13 11 0 6 3 11 7 11z" fill="#eaf4ff" ${s}/><path d="M32 25v20M25 38l7 7 7-7" ${s}/>`,
  'Workers':`<circle cx="32" cy="19" r="8" fill="#dceeff" ${s}/><path d="M17 51c1-12 7-18 15-18s14 6 15 18" fill="#eee9ff" ${s}/><path d="M42 42h12M48 36v12" ${s}/>`,
  'Garments':`<path d="M25 12h14l4 9 10 7-7 10-7-5v21H25V33l-7 5-7-10 10-7z" fill="#e8f4ff" ${s}/><path d="M28 12c0 5 8 8 8 0M25 31h14" fill="none" ${s}/>`,
  'Design Library':`<path d="M12 17h40v34H12z" fill="#eee9ff" ${s}/><path d="M17 17V11h30v6M21 27h22M21 35h16" ${s}/><path d="m44 41 5 5-8 8-5-5z" fill="#ffd98e" ${s}/><path d="m40 45 4 4" ${s}/>`,
  'Settings':`<circle cx="32" cy="32" r="10" fill="#eee9ff" ${s}/><path d="M32 8v7M32 49v7M8 32h7M49 32h7M15 15l5 5M44 44l5 5M49 15l-5 5M20 44l-5 5" ${s}/><circle cx="32" cy="32" r="4" fill="#6b5ce7"/>`,
  'Plans & Upgrade':`<path d="m32 7 18 10-5 30-13 10-13-10-5-30z" fill="#e8f4ff" ${s}/><path d="m32 7 8 13-8 11-8-11z" fill="#d8d0ff" ${s}/><path d="m24 20 8 11 8-11" fill="#ffe19a" ${s}/><path d="M18 48h28" ${s}/>`
 };
 return F(shapes[t]||`<circle cx="32" cy="32" r="20" fill="#eee9ff" ${s}/>`);

function esc(x){return String(x||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function money(x){return'₹'+Number(x||0).toLocaleString('en-IN')}function save(){localStorage.setItem(CK,JSON.stringify(cs));localStorage.setItem(OK,JSON.stringify(os))}
function el(id){return document.getElementById(id)}function designLabel(o){const g=(o.garments||[]).find(x=>x.design);return g&&g.design?(' • 🎨 '+g.design.name):''}
function render(){if(!p)return;el('topshop').textContent=(p.shop||'My Shop')+' • '+(p.city||'')+', '+(p.state||'');el('topowner').textContent='Owner: '+(p.name||'')+' • Plan: '+PLAN_INFO[plan].name;el('nc').textContent=cs.length;el('no').textContent=os.length;const balance=os.reduce((s,o)=>s+Math.max(0,Number(o.total||0)-Number(o.advance||0)),0);el('nb').textContent=money(balance);const t=new Date().toISOString().slice(0,10),m=t.slice(0,7);el('td').textContent=os.filter(o=>o.delivery===t).length;el('ppay').textContent=money(balance);el('mo').textContent=os.filter(o=>(o.created||'').slice(0,7)===m).length;el('ad').textContent=plan==='free'?'ADVERTISEMENT · FREE PLAN':plan==='standard'?'ADVERTISEMENT · ADVANCE (1×/DAY)':'✓ '+PLAN_INFO[plan].name+' · AD-FREE';el('recent').innerHTML=os.slice(-5).reverse().map(o=>'<div class="row"><span><b>'+esc(o.customer)+'</b><br><small>'+esc(o.garment)+' • '+esc(o.delivery)+'</small></span><b>'+money(o.total)+'</b></div>').join('')||'<div class="empty">अभी कोई order नहीं है।</div>'}
icons.innerHTML=mods.map(x=>'<button class="ico" onclick="openM(\''+x[1]+'\')"><i class="dash-icon">'+dashboardIcon(x[0])+'</i><small>'+x[0]+'</small></button>').join('');
const PLAN_INFO={
free:{name:'FREE',price:'₹0',storage:'1 GB',devices:1,photos:'OFF',wa:'OFF',ads:'Banner + App-open'},

  const rate=prompt('Default stitching rate ₹:',String(g.rate||0)),name=n.trim(),r=Math.max(0,Number(rate||0));

function saveUploadedDesign(type,inputEl){
  const input=inputEl||document.getElementById('designPhotoInput'),file=input&&input.files&&input.files[0];if(!file)return;
  // Camera/Gallery is available to every plan; storage quota is enforced separately by the user's plan.
  const reader=new FileReader();
  reader.onload=function(e){const img=new Image();img.onload=function(){const max=900,scale=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*scale);cv.height=Math.round(img.height*scale);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);const data=cv.toDataURL('image/jpeg',.78);const name=(file.name||type+' Design').replace(/\.[^.]+$/,'').slice(0,60);const a=loadSavedDesigns();a.push({id:'upload_'+Date.now(),type,name,image:data,savedAt:Date.now(),source:'Camera/Gallery'});try{saveSavedDesigns(a);alert('Design My Designs me save ho gaya ✓');openDesignCatalog(type)}catch(err){alert('Photo save nahi ho paayi. Photo size kam karke dobara try karein.')}};img.src=e.target.result};reader.readAsDataURL(file);
}
function saveCatalogExternalDesign(type){
  const x=document.getElementById('catalogExternalUrl'),url=String(x?.value||'').trim();
  if(!/^https?:\/\//i.test(url)){alert('Valid website link dijiye.');return}
  const a=loadSavedDesigns();a.push({id:'ext_'+Date.now(),type,name:type+' External Design',url,savedAt:Date.now(),external:true});saveSavedDesigns(a);alert('Design link catalogue me save ho gaya ✓');openGarmentFolder();
}
function designMediaHtml(d){

  if(d.external||d.url)return '<div style="text-align:center;padding:18px"><div style="font-size:42px">🔗</div><b>External Design</b><small style="display:block;margin-top:6px">Website link saved</small></div>';
  return d.svg||designVisual(d.type,d.index||0);
}

function filterDesignChip(type,label,btn){
  const search=el('designSearch');if(search)search.value='';
  document.querySelectorAll('.design-chip').forEach(x=>x.classList.remove('active'));
  if(btn)btn.classList.add('active');
  const saved=loadSavedDesigns();
  let designs=garmentDesignsFor(type).concat(saved.filter(x=>x.type===type).map(x=>({...x,svg:x.svg||designVisual(type,x.index||0)})));
  if(label!=='All Designs')designs=designs.filter(d=>d.name===label);
  const grid=el('designGrid');if(grid)grid.innerHTML=designs.map(d=>designCardHtml(d,saved)).join('')||'<div class="design-empty">Design nahi mila.</div>';
}
function filterDesigns(type){
  const q=String(el('designSearch')?.value||'').toLowerCase();
  const saved=loadSavedDesigns();
  const designs=garmentDesignsFor(type).concat(saved.filter(x=>x.type===type).map(x=>({...x,svg:x.svg||designVisual(type,0)}))).filter(d=>d.name.toLowerCase().includes(q));
  const grid=el('designGrid');if(grid)grid.innerHTML=designs.map(d=>designCardHtml(d,saved)).join('')||'<div class="design-empty">Design nahi mila.</div>';
}
function toggleSavedDesign(id,type,name){
  const a=loadSavedDesigns(),i=a.findIndex(x=>x.id===id);
  if(i>=0)a.splice(i,1);
  else{
    const d=garmentDesignsFor(type).find(x=>x.id===id);
    a.push({id,type,name,index:d?.index??0,svg:d?.svg||designVisual(type,d?.index??0),image:d?.image||'',savedAt:Date.now()});
  }
  saveSavedDesigns(a);openDesignCatalog(type);
}

function showDesignToCustomer(type,name,orderIndex){
  const all=garmentDesignsFor(type);
  const saved=loadSavedDesigns().filter(x=>x.type===type);
  const d=all.find(x=>x.name===name)||saved.find(x=>x.name===name);
  if(!d)return;
  if(d.external&&d.url){window.open(d.url,'_blank','noopener,noreferrer');return;}
  const safeType=esc(type).replace(/'/g,"\\'");
  const safeName=esc(name).replace(/'/g,"\\'");
  const preview=d.image?'<img src="'+d.image+'" alt="'+esc(d.name)+'" loading="eager">':d.svg;
  const selectAction=(orderIndex!==undefined)?'selectDesignForOrder('+orderIndex+',\''+safeType+'\',\''+safeName+'\')':'openDesignCatalog(\''+safeType+'\')';
  const selectText=(orderIndex!==undefined)?'✓ Select Design for Order':'✓ Select Design';
  const backAction=(orderIndex!==undefined)?'openDesignCatalogForOrder(\''+safeType+'\','+orderIndex+')':'openDesignCatalog(\''+safeType+'\')';
  mt.textContent='👁 '+type+' Design Preview';
  mb.innerHTML='<div class="design-back"><button class="secondary" onclick="'+backAction+'">← Designs</button></div><div style="text-align:center"><div style="font-size:18px;font-weight:800;margin:8px 0 4px">'+esc(name)+'</div><div class="preview-large">'+preview+'</div><p class="muted">Customer ko yahi design dikhaye.</p><div style="display:flex;gap:8px;justify-content:center"><button class="primary" onclick="'+selectAction+'">'+selectText+'</button><button class="secondary" onclick="'+backAction+'">Back</button></div></div>';
}

function refreshGarmentFields(i){
  const card=document.getElementById('garment-'+i);if(!card)return;

  let removed=[];try{removed=JSON.parse(card.dataset.removedMeasures||'[]')}catch(_){removed=[]}

function refreshMeasurementRestoreBox(i){

function removeOrderMeasurement(i,name){
  const card=document.getElementById('garment-'+i);if(!card)return;
  let removed=[];try{removed=JSON.parse(card.dataset.removedMeasures||'[]')}catch(_){removed=[]}
  let removedValues={};try{removedValues=JSON.parse(card.dataset.removedValues||'{}')}catch(_){removedValues={}}
  const input=Array.from(card.querySelectorAll('.g-measure')).find(x=>x.dataset.name===name);
  if(input)removedValues[name]=input.value||'';
  if(!removed.includes(name))removed.push(name);
  card.dataset.removedMeasures=JSON.stringify(removed);
  card.dataset.removedValues=JSON.stringify(removedValues);
  refreshGarmentFields(i);
}
function restoreOrderMeasurement(i,name){
  const card=document.getElementById('garment-'+i);if(!card)return;

  card.dataset.removedMeasures=JSON.stringify(removed);
  refreshGarmentFields(i);
}

(function(){
  function removeDuplicateDesignIcon(){
    document.querySelectorAll('.ico').forEach(function(el){
      var txt=(el.textContent||'').trim().toLowerCase();
      if(txt.indexOf('design library')>=0){el.remove();}
    });
  }
  function garmentManagement(){
    var modal=document.getElementById('modal'), title=document.getElementById('mt'), body=document.getElementById('mb');
    if(!modal||!title||!body)return;
    title.textContent='👗 Garments';
    var types=['Kurti','Blouse','Salwar Suit','Kameez','Saree Blouse','Lehenga','Gown','Dress','Shirt','Pant','Salwar','Choli','Sherwani','Suit','Blazer','Waistcoat','Pajama','School Uniform','Coat','Other'];
    body.innerHTML='<div class="card" style="margin:0 0 12px 0"><h3 style="margin:0 0 6px">👗 Garment Management</h3><div class="muted">Yahan sirf garment types manage honge. Customer ko design dikhana aur design select karna <b>New Order</b> ke andar hi rahega.</div></div>'+
      '<div class="garment-library">'+types.map(function(t){return '<div class="garment-library-card" style="cursor:default"><div style="font-size:32px;text-align:center;padding:14px 0">👗</div><b>'+t+'</b><small>Garment Type</small><button type="button" class="secondary" style="width:100%;margin-top:9px" onclick="alert(\''+t+' garment settings yahan manage ki jayengi.\')">⚙️ Manage</button></div>';}).join('')+'</div>'+ 
      '<div class="card" style="margin-top:12px"><b>Design selection:</b><div class="muted" style="margin-top:5px">New Order → Customer → Garment → Select Design. Isliye yahan duplicate ready-made design cards nahi honge.</div></div>';
    modal.classList.add('show');
  }
  function patch(){
    removeDuplicateDesignIcon();
    if(typeof window.openM==='function' && !window.__sgGarmentsPatched){
      var old=window.openM;
      window.openM=function(t){if(t==='garments'){garmentManagement();return;} return old.apply(this,arguments);};
      window.__sgGarmentsPatched=true;
    }
  }
  patch();
  new MutationObserver(function(){removeDuplicateDesignIcon();}).observe(document.body,{childList:true,subtree:true});
})();
</script>
